name: Deploy Lovelace

on:
  workflow_dispatch:
    inputs:
      dashboards:
        description: Dashboards to push via Home Assistant API (Nabu Casa)
        type: choice
        options:
          - all
          - flux-ui-both
          - flux-ui
          - flux-ui-tablet
          - mobile-home
        default: all
  push:
    branches:
      - cursor/flux-ui-md3-dashboard-bf3a
      - cursor/nas-array-planning-docs
      - cursor/main-shed-button-status-6a19
      - cursor/garage-gate-arrival-6a19
    paths:
      - .github/workflows/deploy-lovelace.yml
      - home-assistant/flux-ui-dashboard/lovelace/**
      - home-assistant/flux-ui-dashboard/*.yaml
      - home-assistant/mobile-dashboard/scripts/**
      - home-assistant/garage-doors/entities.yaml
      - home-assistant/garage-doors/garage_ui_helpers.py
      - home-assistant/garage-doors/automations/**
      - home-assistant/garage-doors/packages/**

concurrency:
  group: deploy-lovelace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push Lovelace to Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          if [ -f home-assistant/flux-ui-dashboard/requirements.txt ]; then
            pip install -r home-assistant/flux-ui-dashboard/requirements.txt
          fi
          pip install websockets pyyaml

      - name: Check secrets
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          if [ -z "$HA_URL" ] || [ -z "$HA_TOKEN" ]; then
            echo "Missing GitHub secrets HA_URL and/or HA_TOKEN."
            echo "HA_URL must be the Nabu Casa Remote UI origin (https://….ui.nabu.casa)."
            echo "HA_TOKEN is a long-lived Home Assistant access token."
            exit 1
          fi
          case "$HA_URL" in
            *192.168.1.239*|*localhost*)
              echo "HA_URL is a LAN address — GitHub Actions cannot reach it. Use the Nabu Casa URL."
              exit 1
              ;;
          esac

      - name: Deploy Flux UI (API only)
        if: ${{ !contains(fromJSON('["mobile-home"]'), github.event.inputs.dashboards || 'all') }}
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.dashboards || 'all' }}"
          if [ ! -f home-assistant/flux-ui-dashboard/scripts/deploy_flux_ui.py ]; then
            echo "Flux UI deploy script not on this branch — skipping."
            exit 0
          fi
          EXTRA=(--api-only)
          case "$TARGET" in
            flux-ui) EXTRA+=(--skip-tablet) ;;
            flux-ui-tablet) EXTRA+=(--skip-phone) ;;
            flux-ui-both|all) ;;
            *) echo "Unknown dashboards input: $TARGET"; exit 1 ;;
          esac
          python3 home-assistant/flux-ui-dashboard/scripts/deploy_flux_ui.py "${EXTRA[@]}"

      - name: Deploy Mobile Home (API only)
        if: ${{ contains(fromJSON('["all", "mobile-home"]'), github.event.inputs.dashboards || 'all') }}
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          python3 home-assistant/mobile-dashboard/scripts/deploy_mobile_home.py --api-only --ha-url "$HA_URL"
