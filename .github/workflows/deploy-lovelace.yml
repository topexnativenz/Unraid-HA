name: Deploy Lovelace

on:
  workflow_dispatch:
    inputs:
      dashboards:
        description: Dashboards to push via Home Assistant API (Nabu Casa)
        type: choice
        options:
          - all
          - flux-ui-both
          - flux-ui
          - flux-ui-tablet
          - mobile-home
        default: all
      set_default:
        description: Set iOS/system default dashboard panel
        type: choice
        options:
          - flux-ui
          - mobile-home
          - none
        default: flux-ui
  push:
    branches:
      - cursor/flux-ui-md3-dashboard-bf3a
      - cursor/flux-ui-shed-lights-music-6a19
      - cursor/nas-array-planning-docs
    paths:
      - .github/workflows/deploy-lovelace.yml
      - home-assistant/flux-ui-dashboard/lovelace/**
      - home-assistant/flux-ui-dashboard/*.yaml
      - home-assistant/flux-ui-dashboard/scripts/**
      - home-assistant/flux-ui-dashboard/packages/**
      - home-assistant/mobile-dashboard/scripts/**

concurrency:
  group: deploy-lovelace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push Lovelace to Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          if [ -f home-assistant/flux-ui-dashboard/requirements.txt ]; then
            pip install -r home-assistant/flux-ui-dashboard/requirements.txt
          fi
          pip install websockets pyyaml

      - name: Check secrets
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          if [ -z "$HA_URL" ] || [ -z "$HA_TOKEN" ]; then
            echo "Missing GitHub secrets HA_URL and/or HA_TOKEN."
            echo "HA_URL must be the Nabu Casa Remote UI origin (https://….ui.nabu.casa)."
            echo "HA_TOKEN is a long-lived Home Assistant access token."
            exit 1
          fi
          case "$HA_URL" in
            *192.168.1.239*|*localhost*)
              echo "HA_URL is a LAN address — GitHub Actions cannot reach it. Use the Nabu Casa URL."
              exit 1
              ;;
          esac

      - name: Deploy Flux UI phone
        if: ${{ contains(fromJSON('["all", "flux-ui-both", "flux-ui"]'), github.event.inputs.dashboards || 'all') }}
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          python3 home-assistant/flux-ui-dashboard/scripts/deploy_flux_ui.py \
            --api-only --skip-tablet

      - name: Deploy Flux UI tablet
        if: ${{ contains(fromJSON('["all", "flux-ui-both", "flux-ui-tablet"]'), github.event.inputs.dashboards || 'all') }}
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          python3 home-assistant/flux-ui-dashboard/scripts/deploy_flux_ui.py \
            --api-only --skip-phone

      - name: Deploy Mobile Home
        if: ${{ contains(fromJSON('["all", "mobile-home"]'), github.event.inputs.dashboards || 'all') }}
        continue-on-error: true
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          if [ -f home-assistant/mobile-dashboard/scripts/deploy_mobile_home.py ]; then
            python3 home-assistant/mobile-dashboard/scripts/deploy_mobile_home.py \
              --api-only --ha-url "$HA_URL"
          else
            echo "Mobile Home deploy script missing on this branch — skipping."
          fi

      - name: Set default dashboard (iOS / system)
        if: ${{ always() && (github.event.inputs.set_default || 'flux-ui') != 'none' }}
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          PANEL: ${{ github.event.inputs.set_default || 'flux-ui' }}
        run: |
          python3 home-assistant/mobile-dashboard/scripts/set_mobile_home_default.py \
            --ha-url "$HA_URL" \
            --panel "$PANEL"
          echo "Default panel set to $PANEL — force-quit iOS Companion and clear Frontend Cache."
