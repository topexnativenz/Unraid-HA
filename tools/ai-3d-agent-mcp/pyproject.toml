[project]
name = "ai-3d-agent-mcp"
version = "0.1.0"
description = "MCP server: image/text to print-ready 3MF for Bambu Studio / iOS (X1 Carbon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.28.0",
  "numpy>=1.26.0",
  "trimesh>=4.4.0",
  "networkx>=3.0",
  "lxml>=5.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ai-3d-agent-mcp = "ai_3d_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_3d_agent_mcp"]
