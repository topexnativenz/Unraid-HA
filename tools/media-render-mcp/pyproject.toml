[project]
name = "media-render-mcp"
version = "0.1.0"
description = "MCP server for Fal-backed solar dashboard background renders and HA publish"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.28.0",
  "fal-client>=0.5.0",
]

[project.scripts]
media-render-mcp = "media_render_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_render_mcp"]
