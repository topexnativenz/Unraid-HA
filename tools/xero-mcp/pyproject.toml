[project]
name = "xero-mcp-auth"
version = "0.1.0"
description = "OAuth PKCE helper and MCP wrapper support for Xero multi-org access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28.0",
  "mcp>=1.6.0",
  "pypdf>=5.0.0",
]

[project.scripts]
xero-mcp-auth = "xero_mcp.__main__:main"
xero-orgs-mcp = "xero_mcp.server:main"
xero-inbound-mcp = "xero_mcp.inbound_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xero_mcp"]
