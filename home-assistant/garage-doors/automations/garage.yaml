# House Garage on Tessie arrival — triggers aligned with gate_open_on_arrival*.
#
# Model X: Tessie road/gate + distance_to_home. Model S Tessie GPS stays at home,
# so person.gen / gens_phone / person.dave not_home → Road/Gate Approach is the
# same approach signal (clone of model_x_road / model_x_gate).

- id: house_garage_open_on_gate_departure
  alias: House Garage — open when Tesla departure starts
  description: >-
    Opens House Garage when leaving so the car can roll out. Complements arrival
    session (same as Model X shift → gate_departure_in_progress).
  triggers:
    - trigger: state
      entity_id: input_boolean.gate_departure_in_progress
      from: "off"
      to: "on"
  conditions:
    - condition: template
      value_template: >-
        {% set last = states.script.pulse_house_garage_door %}
        {{ last is none or last.attributes.last_triggered is none
           or (now() - last.attributes.last_triggered).total_seconds() > 90 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
    - choose:
        - conditions:
            - condition: state
              entity_id: light.garage
              state: "off"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.garage
  mode: single

- id: house_garage_open_on_gate_session
  alias: House Garage — open when gate arrival session starts
  description: >-
    Opens House Garage whenever the gate Tessie arrival session starts (gate opened
    for Model S or X). Dedicated automation avoids race with combined trigger logic.
  triggers:
    - trigger: state
      entity_id: input_boolean.gate_arrival_session
      from: "off"
      to: "on"
  conditions:
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
    - choose:
        - conditions:
            - condition: state
              entity_id: light.garage
              state: "off"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.garage
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: House Garage
        message: Opening with gate — arrival session started.
        data:
          tag: house_garage_arrival
          channel: gate
  mode: single

- id: house_garage_open_on_tessie_arrival
  alias: House Garage — open on Tessie approach (Model S or X)
  description: >-
    Backup path when gate session does not start but approach is reported.
    Model X: Tessie distance_to_home. Model S: person.gen/dave Road/Gate Approach
    (clone of model_x_road / model_x_gate) because S Tessie GPS stays at home.
  triggers:
    - id: model_s_road
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: model_s_gate
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: model_s_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and (
             is_state('input_boolean.model_s_was_away', 'on')
             or states('sensor.model_s_tessie_distance_to_gate') | float(0) > 300
           ) }}
      for:
        seconds: 10
    - id: model_s_person_road
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Gate Approach
        - unknown
        - unavailable
      to: Road Approach
    - id: model_s_person_gate
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - unknown
        - unavailable
      to: Gate Approach
    - id: model_s_person_home
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Road Approach
        - Gate Approach
        - unknown
        - unavailable
      to: home
    - id: model_x_road
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: model_x_gate
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: model_x_home_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_home') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(400)
           and (
             is_state('input_boolean.model_x_was_away', 'on')
             or states('sensor.model_x_tessie_distance_to_home') | float(0) > 250
           ) }}
      for:
        seconds: 15
    - id: model_x_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and (
             is_state('input_boolean.model_x_was_away', 'on')
             or states('sensor.model_x_tessie_distance_to_gate') | float(0) > 300
           ) }}
      for:
        seconds: 10
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "off"
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: template
      value_template: >-
        {{ trigger.id in [
             'model_s_road', 'model_s_gate',
             'model_x_road', 'model_x_gate'
           ]
           or (
             trigger.id == 'model_s_gate_distance'
             and (
               is_state('input_boolean.model_s_was_away', 'on')
               or states('sensor.model_s_tessie_distance_to_gate') | float(0) > 200
             )
           )
           or (
             trigger.id in ['model_s_person_road', 'model_s_person_gate']
             and is_state('input_boolean.model_s_was_away', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_road_approach', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_gate_approach', 'on')
           )
           or (
             trigger.id == 'model_s_person_home'
             and is_state('input_boolean.model_s_was_away', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_road_approach', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_gate_approach', 'on')
             and (
               is_state('binary_sensor.model_s_p100d_user_present', 'on')
               or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on')
             )
           )
           or (
             trigger.id == 'model_x_home_distance'
             and (
               is_state('input_boolean.model_x_was_away', 'on')
               or states('sensor.model_x_tessie_distance_to_home') | float(0) > 200
             )
           )
           or (
             trigger.id == 'model_x_gate_distance'
             and (
               is_state('input_boolean.model_x_was_away', 'on')
               or states('sensor.model_x_tessie_distance_to_gate') | float(0) > 200
             )
           ) }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
    - choose:
        - conditions:
            - condition: state
              entity_id: light.garage
              state: "off"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.garage
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: House Garage
        message: >-
          Opening on approach — {{ trigger.id | replace('model_s_', 'Model S ')
          | replace('model_x_', 'Model X ') | replace('_', ' ') }}.
        data:
          tag: house_garage_arrival
          channel: gate
  mode: single

- id: garage_outside_lights_on_tessie_arrival_after_dark
  alias: Garage outside lights — on Tessie arrival after dark
  description: >-
    Turns on light.outside_garage when either Tesla triggers arrival signals.
  triggers:
    - id: gate_session_on
      trigger: state
      entity_id: input_boolean.gate_arrival_session
      from: "off"
      to: "on"
    - id: model_s_road
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: model_s_gate
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: model_s_person_road
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Gate Approach
        - unknown
        - unavailable
      to: Road Approach
    - id: model_s_person_gate
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - unknown
        - unavailable
      to: Gate Approach
    - id: model_s_person_home
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Road Approach
        - Gate Approach
        - unknown
        - unavailable
      to: home
    - id: model_x_road
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: model_x_gate
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: model_x_home_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_home') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(400)
           and (
             is_state('input_boolean.model_x_was_away', 'on')
             or states('sensor.model_x_tessie_distance_to_home') | float(0) > 250
           ) }}
      for:
        seconds: 15
  conditions:
    - condition: sun
      after: sunset
      before: sunrise
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: template
      value_template: >-
        {{ trigger.id not in ['model_s_person_road', 'model_s_person_gate', 'model_s_person_home']
           or (
             is_state('input_boolean.model_s_was_away', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_road_approach', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_gate_approach', 'on')
             and (
               trigger.id != 'model_s_person_home'
               or is_state('binary_sensor.model_s_p100d_user_present', 'on')
               or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on')
             )
           ) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.garage_outside_lights_arrival_active
    - action: light.turn_on
      target:
        entity_id: light.outside_garage
  mode: single

- id: garage_outside_lights_off_house_garage_closed
  alias: Garage outside lights — off when House Garage closes
  description: >-
    Turns off light.outside_garage when any House Garage contact sensor reports closed.
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.house_garage_door_is_open
        - binary_sensor.house_garage_door_sensor_door
      from: "on"
      to: "off"
  conditions:
    - condition: state
      entity_id: input_boolean.garage_outside_lights_arrival_active
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.outside_garage
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.garage_outside_lights_arrival_active
  mode: single
