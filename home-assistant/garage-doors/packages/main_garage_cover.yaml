# Main Garage — template cover driven by Tapo/Tuya contact sensor + Shelly momentary relay.
# Contact sensor: binary_sensor.garage_door_sensor_open (off = closed, on = open).
# Relay pulse: switch.garage_door_1 (Shelly 1G3 on Main Garage opener circuit).

cover:
  - platform: template
    covers:
      garage_door:
        device_class: garage
        friendly_name: Main Garage Door
        value_template: >
          {{ is_state('binary_sensor.garage_door_sensor_open', 'on') }}
        open_cover:
          service: switch.turn_on
          target:
            entity_id: switch.garage_door_1
        close_cover:
          service: switch.turn_on
          target:
            entity_id: switch.garage_door_1
        stop_cover:
          service: switch.turn_on
          target:
            entity_id: switch.garage_door_1
