# Momentary Shelly garage relays: one press = pulse relay + flip tracked open state.
# Dashboard uses input_boolean.*_open for red/grey; scripts avoid switch.toggle double-press bug.
# If HA shows switch "on", turn_off first so turn_on always fires the relay pulse.

input_boolean:
  house_garage_door_open:
    name: House Garage open (tracked)
    icon: mdi:garage
  main_shed_door_open:
    name: Main Shed open (tracked)
    icon: mdi:garage
  second_shed_door_open:
    name: Second Shed open (tracked)
    icon: mdi:garage

script:
  pulse_house_garage_door:
    alias: Pulse House Garage door
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: switch.garage_door_3
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.garage_door_3
          - delay:
              milliseconds: 300
      - action: switch.turn_on
        target:
          entity_id: switch.garage_door_3

  pulse_main_shed_door:
    alias: Pulse Main Shed door
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: switch.garage_door_1
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.garage_door_1
          - delay:
              milliseconds: 300
      - action: switch.turn_on
        target:
          entity_id: switch.garage_door_1

  pulse_second_shed_door:
    alias: Pulse Second Shed door
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: switch.garage_door_2
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.garage_door_2
          - delay:
              milliseconds: 300
      - action: switch.turn_on
        target:
          entity_id: switch.garage_door_2

# Sync tracked booleans from Tapo contact sensors (source of truth for dashboard icons).
# Sensor entity IDs: see ../entities.yaml — update to match your Tapo device names.
automation:
  - id: garage_sync_house_garage_from_tapo
    alias: Garage — sync House Garage tracked state from Tapo
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.house_garage_door_is_open
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_state('binary_sensor.house_garage_door_is_open', ['on', 'open']) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.house_garage_door_open
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.house_garage_door_open

  - id: garage_sync_main_shed_from_tapo
    alias: Garage — sync Main Shed tracked state from Tapo
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.shed_main_door_is_open
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_state('binary_sensor.shed_main_door_is_open', ['on', 'open']) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.main_shed_door_open
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.main_shed_door_open

  - id: garage_sync_second_shed_from_tapo
    alias: Garage — sync Second Shed tracked state from Tapo
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.second_shed_door_is_open
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_state('binary_sensor.second_shed_door_is_open', ['on', 'open']) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.second_shed_door_open
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.second_shed_door_open
