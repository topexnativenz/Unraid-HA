# Tapo T110 contact sensors — source of truth for open/closed icons.
# Live HA entity IDs (TP-Link integration names devices, not always *_is_open).
# Run discover on your LAN: python3 home-assistant/garage-doors/scripts/discover_garage_doors.py --apply
#
# Standard: on = open, off = closed. Set invert: true if reversed.

doors:
  - name: House Garage
    script: script.pulse_house_garage_door
    tracked: input_boolean.house_garage_door_open
    sensor: binary_sensor.house_garage_door_sensor_door
    invert: false

  - name: Main Shed
    script: script.pulse_main_shed_door
    tracked: input_boolean.main_shed_door_open
    # Device "Shed Main Door" — entity_id stayed contact_sensor_door after adoption.
    sensor: binary_sensor.contact_sensor_door
    invert: false

  - name: Second Shed
    script: script.pulse_second_shed_door
    tracked: input_boolean.second_shed_door_open
    sensor: binary_sensor.second_shed_door_is_open
    invert: false
    # No Tapo on this door yet — discover sets enabled: true when sensor appears in HA
    enabled: false
