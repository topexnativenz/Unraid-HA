# Tapo T110 contact sensors — source of truth for open/closed icons.
# TP-Link integration uses binary_sensor.*_is_open (device_class: door).
# Run discover on your LAN: python3 home-assistant/garage-doors/scripts/discover_garage_doors.py --apply
#
# Standard: on = open, off = closed. Set invert: true if reversed.

doors:
  - name: House Garage
    script: script.pulse_house_garage_door
    tracked: input_boolean.house_garage_door_open
    # Live Tapo door contact (same entity the locked tablet baseline uses).
    sensor: binary_sensor.house_garage_door_sensor_door
    invert: false

  - name: Main Shed
    script: script.pulse_main_shed_door
    tracked: input_boolean.main_shed_door_open
    # Template door sensor on HA. binary_sensor.shed_main_door_is_open is not installed.
    sensor: binary_sensor.casa_luna_main_shed_garage_door
    invert: false

  - name: Second Shed
    script: script.pulse_second_shed_door
    tracked: input_boolean.second_shed_door_open
    # No Tapo contact exists for this door. Binding the tile to the missing
    # binary_sensor.second_shed_door_is_open caused an Active-tab configuration
    # error, so the button was disabled and phone deploys dropped it.
    # The tracked boolean exists; the tile pulses the Shelly and flips it.
    sensor: input_boolean.second_shed_door_open
    invert: false
    enabled: true
    toggle_tracked: true
