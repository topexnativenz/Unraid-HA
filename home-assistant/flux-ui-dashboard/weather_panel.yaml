# Weather panel — ElementZoom layout, data from MetService NZ (no local weather station).
# Run: python3 scripts/discover_weather.py --apply  (during deploy) to wire live HA entities.

enabled: true
weather_entity: weather.metservice

source_label: MetService
source_url: https://www.metservice.com/warnings/home

# Radar + Lunar tabs — updated from HA home coordinates by discover_weather.py --apply
location:
  latitude: -37.7870
  longitude: 175.2793
  city: ""
  country: New Zealand

# MetService integration sensors — auto-filled by discover_weather.py --apply
metservice:
  weather_entity: weather.metservice
  sensors: {}

# MetService warnings sensor (enables Warning tab when active)
# warnings_entity: sensor.home_metservice_weather_warnings

# Optional WAQI air-quality sensor for Forecast tab second card
# aqi_entity: sensor.your_town_air_quality_index

# Flux UI derived sensors (packages/flux_ui_weather.yaml — from weather.get_forecasts)
entities:
  hourly_forecast: sensor.flux_ui_hourly_forecast_full
  daily_forecast: sensor.flux_ui_daily_forecast_data
  next_rain_summary: sensor.flux_ui_next_rain_summary
  rainfall_summary: sensor.flux_ui_24h_rainfall_summary
  uv_cloud_summary: sensor.flux_ui_uv_and_cloud_summary
  wind_summary: sensor.flux_ui_wind_summary
  moon_summary: sensor.flux_ui_moon_summary
  forecast_rainfall: sensor.flux_ui_forecast_rainfall
  forecast_temperature: sensor.flux_ui_forecast_temperature
  forecast_uv_index: sensor.flux_ui_forecast_uv_index
  forecast_cloud_coverage: sensor.flux_ui_forecast_cloud_coverage
  forecast_wind_speed: sensor.flux_ui_forecast_wind_speed
  forecast_wind_direction: sensor.flux_ui_forecast_wind_direction
