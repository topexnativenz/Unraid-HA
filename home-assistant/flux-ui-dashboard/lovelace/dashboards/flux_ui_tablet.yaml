          \ => hay.includes(k))) { occId = eid; break; }\n    }\n  }\n  let tempId = variables.temperature_entity;\n  if (!tempId\
          \ || !states[tempId] || ['unavailable','unknown'].includes(states[tempId].state)) {\n    const keywords = (variables.keywords\
          \ || []).map(k => k.toLowerCase());\n    for (const [eid, st] of Object.entries(states)) {\n      if (!eid.startsWith('sensor.'))\
          \ continue;\n      const cls = st.attributes?.device_class || '';\n      const hay = (eid + ' ' + (st.attributes?.friendly_name\
          \ || '')).toLowerCase();\n      if (cls !== 'temperature' && !hay.includes('temperature')) continue;\n      if (keywords.some(k\
          \ => hay.includes(k))) { tempId = eid; break; }\n    }\n  }\n  let humidId = variables.humidity_entity;\n  if (!humidId\
          \ || !states[humidId] || ['unavailable','unknown'].includes(states[humidId].state)) {\n    const keywords = (variables.keywords\
          \ || []).map(k => k.toLowerCase());\n    for (const [eid, st] of Object.entries(states)) {\n      if (!eid.startsWith('sensor.'))\
          \ continue;\n      const cls = st.attributes?.device_class || '';\n      const hay = (eid + ' ' + (st.attributes?.friendly_name\
          \ || '')).toLowerCase();\n      if (cls !== 'humidity' && !hay.includes('humidity')) continue;\n      if (keywords.some(k\
          \ => hay.includes(k))) { humidId = eid; break; }\n    }\n  }\n  const pill = (label, icon, active) => {\n    const\
          \ bg = active\n      ? 'background:rgba(208,188,255,0.38);border:1px solid rgba(208,188,255,0.65);'\n      : 'background:rgba(255,255,255,0.07);border:1px\
          \ solid rgba(255,255,255,0.14);';\n    const color = active ? '#fff' : 'var(--md-sys-color-on-surface-variant)';\n\
          \    return `\n      <div style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;${bg}font-size:12px;font-weight:600;color:${color};white-space:nowrap;\"\
          >\n        <ha-icon icon=\"${icon}\" style=\"width:16px;height:16px;color:inherit;\"></ha-icon>\n        <span>${label}</span>\n\
          \      </div>`;\n  };\n  const chips = [];\n  if (occId && states[occId] && !['unavailable','unknown'].includes(states[occId].state))\
          \ {\n    const on = ['on','open','home'].includes(states[occId].state);\n    chips.push(pill(on ? 'Occupied' : 'Empty',\
          \ 'mdi:account', on));\n  } else {\n    chips.push(pill('—', 'mdi:account', false));\n  }\n  if (tempId && states[tempId]\
          \ && !['unavailable','unknown'].includes(states[tempId].state)) {\n    const v = parseFloat(states[tempId].state);\n\
          \    const t = Number.isFinite(v) ? v.toFixed(1) : states[tempId].state;\n    chips.push(pill(`Cool (${t}°C)`, 'mdi:thermometer',\
          \ true));\n  } else {\n    chips.push(pill('—°C', 'mdi:thermometer', false));\n  }\n  if (humidId && states[humidId]\
          \ && !['unavailable','unknown'].includes(states[humidId].state)) {\n    const v = parseFloat(states[humidId].state);\n\
          \    const h = Number.isFinite(v) ? v.toFixed(1) : states[humidId].state;\n    chips.push(pill(`Humid (${h}%)`,\
          \ 'mdi:water-percent', true));\n  } else {\n    chips.push(pill('—%', 'mdi:water-percent', false));\n  }\n  return\
          \ `<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:2px 0;\">${chips.join('')}</div>`;\n\
          ]]]"
