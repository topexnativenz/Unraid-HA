              sensors: "[[[\nconst isDoorOpen = (st, invert) => {\n  if (!st) return null;\n  const s = String(st.state ??\
                \ '').toLowerCase();\n  if (!s || ['unavailable','unknown','none'].includes(s)) return null;\n  const openish\
                \ = ['on', 'open', 'opened', 'detected', 'true'];\n  const closedish = ['off', 'closed', 'close', 'clear',\
                \ 'false', 'undetected'];\n  if (openish.includes(s)) return invert ? false : true;\n  if (closedish.includes(s))\
                \ return invert ? true : false;\n  return false;\n};\n  const slots = variables.sensor_slots || [];\n  const\
                \ pillWrap = (inner, badge='') => `\n    <div style=\"position:relative;width:35px;height:35px;flex-shrink:0;\"\
                >${badge}${inner}</div>`;\n  const pill = (inner) => `\n    <div style=\"width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"\
                >${inner}</div>`;\n  const stub = () => pillWrap(pill(`\n    <div style=\"width:35px;height:35px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px\
                \ solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;\">\n      <div style=\"\
                width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.14)\"></div>\n    </div>`));\n  const\
                \ iconFor = (eid, st, item, open) => {\n    if (item.icon && open) return item.icon;\n    if (item.icon_closed\
                \ && !open) return item.icon_closed;\n    if (!eid || !st) return 'mdi:circle-small';\n    const dc = st.attributes?.device_class\
                \ || '';\n    if (eid.startsWith('binary_sensor.')) {\n      if (['motion','occupancy','presence'].includes(dc)\
                \ || eid.includes('motion')) {\n        return open ? 'mdi:motion-sensor' : 'mdi:motion-sensor-off';\n   \
                \   }\n      if (['door','garage_door','opening','window'].includes(dc) || eid.includes('door') || eid.includes('contact')\
                \ || eid.includes('garage')) {\n        return open ? (item.icon || 'mdi:garage-open') : (item.icon_closed\
                \ || 'mdi:garage');\n      }\n      return open ? 'mdi:checkbox-marked-circle' : 'mdi:checkbox-blank-circle-outline';\n\
                \    }\n    if (eid.startsWith('light.')) return open ? 'mdi:lightbulb-on' : 'mdi:lightbulb-outline';\n  \
                \  if (eid.startsWith('sensor.')) {\n      if (dc === 'temperature' || eid.includes('temp')) return 'mdi:thermometer';\n\
                \      if (dc === 'humidity' || eid.includes('humid')) return 'mdi:water-percent';\n    }\n    return 'mdi:circle-small';\n\
                \  };\n  const isOpenState = (eid, st, item) => {\n    if (!eid || !st || ['unavailable','unknown'].includes(st.state))\
                \ return null;\n    const dc = st.attributes?.device_class || '';\n    const isDoor = eid.startsWith('binary_sensor.')\
                \ && (\n      ['door','garage_door','opening','window'].includes(dc) || eid.includes('door') || eid.includes('contact')\
                \ || eid.includes('garage') || eid.includes('shed')\n    );\n    if (isDoor) return isDoorOpen(st, !!item.invert);\n\
                \    if (item.invert) return !['on','open','home'].includes(st.state);\n    if (eid.startsWith('light.'))\
                \ return st.state === 'on';\n    if (eid.startsWith('binary_sensor.')) return ['on','open','home','detected'].includes(String(st.state).toLowerCase());\n\
                \    if (eid.startsWith('sensor.')) return st.state !== '' && st.state !== '0';\n    return ['on','open','home'].includes(String(st.state).toLowerCase());\n\
                \  };\n  const styleFor = (item, eid, st) => {\n    if (item.stub || !eid || !st || ['unavailable','unknown'].includes(st.state))\
                \ {\n      return { bg: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', fg: 'rgba(255,255,255,0.2)',\
                \ glow: '', open: false };\n    }\n    const dc = st.attributes?.device_class || '';\n    const open = isOpenState(eid,\
                \ st, item);\n    const isDoor = eid.startsWith('binary_sensor.') && (\n      ['door','garage_door','opening','window'].includes(dc)\
                \ || eid.includes('door') || eid.includes('contact') || eid.includes('garage')\n    );\n    const isMotion\
                \ = eid.startsWith('binary_sensor.') && (\n      ['motion','occupancy','presence'].includes(dc) || eid.includes('motion')\n\
                \    );\n    const isLight = eid.startsWith('light.');\n    const isClimate = eid.startsWith('sensor.') &&\
                \ (dc === 'temperature' || dc === 'humidity' || eid.includes('temp') || eid.includes('humid'));\n    if (isDoor)\
                \ {\n      if (open) {\n        return { bg: item.color_on || '#F2B8B5', border: 'none', fg: '#3b1216', glow:\
                \ 'box-shadow:0 0 10px rgba(242,184,181,0.55);', open: true };\n      }\n      return { bg: item.color_off\
                \ || '#81C784', border: 'none', fg: '#0d2818', glow: 'box-shadow:0 0 8px rgba(129,199,132,0.35);', open: false\
                \ };\n    }\n    if (isMotion) {\n      if (open) {\n        return { bg: item.color_on || '#B388FF', border:\
                \ 'none', fg: '#1c1028', glow: 'box-shadow:0 0 10px rgba(179,136,255,0.5);', open: true };\n      }\n    \
                \  return { bg: item.color_off || 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.14)', fg:\
                \ 'rgba(255,255,255,0.35)', glow: '', open: false };\n    }\n    if (isLight) {\n      if (open) {\n     \
                \   return { bg: item.color_on || '#FFD54F', border: 'none', fg: '#1c1b1f', glow: 'box-shadow:0 0 10px rgba(255,213,79,0.45);',\
                \ open: true };\n      }\n      return { bg: item.color_off || 'rgba(255,255,255,0.08)', border: '1px solid\
                \ rgba(255,255,255,0.14)', fg: 'rgba(255,255,255,0.35)', glow: '', open: false };\n    }\n    if (isClimate)\
                \ {\n      const hue = dc === 'humidity' || eid.includes('humid') ? '#81C784' : '#80DEEA';\n      return {\
                \ bg: item.color_on || hue, border: 'none', fg: '#1c1b1f', glow: 'box-shadow:0 0 8px rgba(128,222,234,0.35);',\
                \ open: true };\n    }\n    if (open) {\n      return { bg: item.color_on || '#FFD54F', border: 'none', fg:\
                \ '#1c1b1f', glow: '', open: true };\n    }\n    return { bg: item.color_off || 'rgba(255,255,255,0.08)',\
                \ border: '1px solid rgba(255,255,255,0.14)', fg: 'rgba(255,255,255,0.35)', glow: '', open: false };\n  };\n\
                \  const cells = slots.slice(0, 4).map(item => {\n    if (item.kind === 'lights') {\n      const ents = item.entities\
                \ || [];\n      const on = ents.filter(e => states[e]?.state === 'on').length;\n      const open = on > 0;\n\
                \      const bg = open ? (item.color_on || '#FFD54F') : (item.color_off || 'rgba(255,255,255,0.08)');\n  \
                \    const fg = open ? '#1c1b1f' : 'rgba(255,255,255,0.35)';\n      const icon = open ? (item.icon || 'mdi:lightbulb-on')\
                \ : (item.icon_closed || 'mdi:lightbulb-outline');\n      const badge = on > 0 ? `<span style=\"position:absolute;top:-4px;right:-6px;min-width:15px;height:15px;border-radius:4px;background:#FFD54F;color:#1c1b1f;font-size:9px;font-weight:700;line-height:15px;text-align:center;padding:0\
                \ 3px;\">${on}</span>` : '';\n      return pillWrap(`<div style=\"width:35px;height:35px;border-radius:50%;background:${bg};${open\
                \ ? 'box-shadow:0 0 10px rgba(255,213,79,0.45);' : 'border:1px solid rgba(255,255,255,0.14);'}display:flex;align-items:center;justify-content:center;\"\
                ><ha-icon icon=\"${icon}\" style=\"width:16px;height:16px;color:${fg};\"></ha-icon></div>`, badge);\n    }\n\
                \    if (item.stub || !item.entity) return stub();\n    const st = states[item.entity];\n    const style =\
                \ styleFor(item, item.entity, st);\n    const icon = iconFor(item.entity, st, item, style.open);\n    return\
                \ pillWrap(`\n      <div style=\"width:35px;height:35px;border-radius:50%;background:${style.bg};border:${style.border};${style.glow}display:flex;align-items:center;justify-content:center;\"\
                >\n        <ha-icon icon=\"${icon}\" style=\"width:16px;height:16px;color:${style.fg};\"></ha-icon>\n    \
                \  </div>`);\n  });\n  while (cells.length < 4) cells.push(stub());\n  return `<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;min-height:154px;width:100%;box-sizing:border-box;padding:4px\
                \ 0;\">${cells.join('')}</div>`;\n]]]"
