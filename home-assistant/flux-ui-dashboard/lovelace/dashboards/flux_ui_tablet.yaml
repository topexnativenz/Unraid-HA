                \ break; }\n    }\n  }\n  if (tempId && states[tempId] && !['unavailable','unknown'].includes(states[tempId].state))\
                \ {\n    const v = parseFloat(states[tempId].state);\n    parts.push(Number.isFinite(v) ? v.toFixed(1) + '°C'\
