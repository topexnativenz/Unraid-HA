              info: "[[[\n  const title = variables.card_name || '';\n  const parts = [];\n  let tempId = variables.temperature_entity;\n\
                \  if (!tempId || !states[tempId] || ['unavailable','unknown'].includes(states[tempId].state)) {\n    const\
