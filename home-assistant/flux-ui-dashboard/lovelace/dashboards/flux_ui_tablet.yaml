views:
- title: Overview
  icon: mdi:home
  path: overview
  type: panel
  theme: flux-ui-md3
  card_mod:
    style: "ha-view {\n  background: center / cover no-repeat fixed url('/local/flux-ui/wallpapers/dark-purple.webp') !important;\n\
      \  height: 100dvh !important;\n  max-height: 100dvh !important;\n  overflow: hidden !important;\n  overscroll-behavior:\
      \ none !important;\n  touch-action: none !important;\n}\n#view {\n  background: transparent !important;\n  max-width:\
      \ none !important;\n  width: 100% !important;\n  height: 100dvh !important;\n  max-height: 100dvh !important;\n  margin:\
      \ 0 !important;\n  padding: 0 !important;\n  overflow: hidden !important;\n  overscroll-behavior: none !important;\n\
      \  touch-action: none !important;\n}\nhui-panel-view,\nhui-view-panel {\n  width: 100% !important;\n  max-width: none\
      \ !important;\n  height: 100dvh !important;\n  max-height: 100dvh !important;\n  overflow: hidden !important;\n  overscroll-behavior:\
      \ none !important;\n  touch-action: none !important;\n}\nhui-panel-view > *,\nhui-view-panel > * {\n  width: 100% !important;\n\
      \  max-width: none !important;\n  height: 100dvh !important;\n  max-height: 100dvh !important;\n  overflow: hidden !important;\n\
      \  overscroll-behavior: none !important;\n  touch-action: none !important;\n}\n@keyframes flux-door-pulse {\n  0%, 100%\
      \ { box-shadow: 0 0 18px rgba(242, 184, 181, 0.45); }\n  50% { box-shadow: 0 0 28px rgba(242, 184, 181, 0.75); }\n}\n\
      @keyframes flux-tesla-charge-pulse {\n  0%, 100% {\n    box-shadow: 0 0 10px 2px rgba(102, 187, 106, 0.35),\n      0\
      \ 0 28px 8px rgba(76, 175, 80, 0.22);\n  }\n  50% {\n    box-shadow: 0 0 22px 6px rgba(129, 199, 132, 0.85),\n     \
      \ 0 0 48px 14px rgba(76, 175, 80, 0.55);\n  }\n}\n"
  cards:
  - type: vertical-stack
    cards:
    - type: vertical-stack
      cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          width: 100%
          max_width: 100%
          height: 100%
          margin: '0'
          padding: 8px 12px 8px 12px
          grid-gap: 8px
          grid-template-columns: 1fr 1fr 1.05fr 1.15fr
          grid-template-rows: minmax(0, 26fr) minmax(0, 42fr) minmax(0, 28fr)
          grid-auto-rows: minmax(0, auto)
          align-content: stretch
          align-items: stretch
          justify-items: stretch
          max_height: 100%
          grid-template-areas: '"greeting simple_tab music calendar_notification"

            "lights cameras music calendar_notification"

            "tesla tesla tesla calendar_notification"'
          card_margin: '0'
        cards:
        - type: custom:mod-card
          view_layout:
            grid-area: greeting
            place-self: stretch stretch
          card:
            type: custom:button-card
            template: flux_glass
            show_icon: false
            show_name: true
            show_label: true
            show_state: false
            name: "[[[\n  if (this && !this.__fluxNzClock) {\n    this.__fluxNzClock = setInterval(() => {\n      try { this.update();\
              \ } catch (e) {}\n    }, 15000);\n  }\n  const parts = new Intl.DateTimeFormat('en-NZ', {\n    timeZone: 'Pacific/Auckland',\n\
              \    hour: 'numeric',\n    minute: '2-digit',\n    hour12: true,\n    hourCycle: 'h12'\n  }).formatToParts(new\
              \ Date());\n  const hour = (parts.find((p) => p.type === 'hour') || {}).value || '';\n  const minute = (parts.find((p)\
              \ => p.type === 'minute') || {}).value || '';\n  return `${hour}:${minute}`;\n]]]"
            label: "[[[\n  return new Date().toLocaleDateString('en-NZ', {\n    timeZone: 'Pacific/Auckland',\n    weekday:\
              \ 'long',\n    day: 'numeric',\n    month: 'long'\n  });\n]]]"
            tap_action:
              action: navigate
              navigation_path: /flux-ui/active
            styles:
              card:
              - padding: 12px 16px
              - min-height: '0'
              - height: 100%
              - overflow: hidden
              - display: flex
              - align-items: center
              - justify-content: center
              grid:
              - grid-template-areas: '''n'' ''l'''
              - grid-template-columns: 1fr
              - grid-template-rows: min-content min-content
              - row-gap: 8px
              - justify-items: center
              - align-content: center
              - height: 100%
              - width: 100%
              name:
              - font-size: 136px
              - font-weight: '700'
              - letter-spacing: 0.04em
              - line-height: '0.9'
              - justify-self: center
              - text-align: center
              - width: 100%
              - font-variant-numeric: tabular-nums
              - color: var(--md-sys-color-on-surface)
              label:
              - font-size: 30px
              - font-weight: '600'
              - letter-spacing: 0.02em
              - justify-self: center
              - text-align: center
              - width: 100%
              - color: var(--md-sys-color-on-surface-variant)
              - opacity: '0.92'
              - padding-left: '0'
          card_mod:
            style: ":host {\n  display: block !important;\n  height: 100% !important;\n  min-height: 0 !important;\n  overflow:\
              \ hidden !important;\n}\nha-card {\n  height: 100% !important;\n  min-height: 0 !important;\n}\n"
        - type: custom:mod-card
          view_layout:
            grid-area: simple_tab
            place-self: stretch stretch
          card:
            type: vertical-stack
            cards:
            - type: custom:button-card
              show_icon: false
              show_name: true
              show_state: false
              name: Gates & Doors
              styles:
                card:
                - background: transparent
                - box-shadow: none
                - border: none
                - padding: 4px 8px 2px 8px
                - margin: '0'
                - height: auto
                - min-height: unset
                - overflow: visible
                name:
                - font-size: 24px
                - font-weight: '600'
                - justify-self: start
                - text-align: left
                - color: var(--primary-text-color)
                - letter-spacing: 0.01em
                - line-height: '1.25'
                grid:
                - grid-template-areas: '''n'''
                - grid-template-columns: 1fr
            - type: grid
              columns: 2
              square: false
              cards:
              - type: custom:button-card
                template: flux_action
                entity: lock.gate_intercom_gate_open
                name: Gate Open
                show_icon: false
                show_entity_picture: true
                entity_picture: "[[[\n  const isOpen = (() => { if (entity.state === 'unlocked' || entity.state === 'opening')\
                  \ return true;\n  const st = states['binary_sensor.casa_luna_gate_status'];\n  if (st && st.state === 'on')\
                  \ return true;\n  const hold = states['input_boolean.gate_hold_active'];\n  if (hold && hold.state === 'on')\
                  \ return true;\n  return false; })();\n  return isOpen ? 'data:image/svg+xml;base64,'\
                  \ : 'data:image/svg+xml;base64,';\n\
                  ]]]"
                label: "[[[\n  const isOpen = (() => { if (entity.state === 'unlocked' || entity.state === 'opening') return\
                  \ true;\n  const st = states['binary_sensor.casa_luna_gate_status'];\n  if (st && st.state === 'on') return\
                  \ true;\n  const hold = states['input_boolean.gate_hold_active'];\n  if (hold && hold.state === 'on') return\
                  \ true;\n  return false; })();\n  return isOpen ? 'Open' : 'Closed';\n]]]"
                tap_action:
                  action: call-service
                  service: "[[[\n  const isOpen = (() => { if (entity.state === 'unlocked' || entity.state === 'opening')\
                    \ return true;\n  const st = states['binary_sensor.casa_luna_gate_status'];\n  if (st && st.state ===\
                    \ 'on') return true;\n  const hold = states['input_boolean.gate_hold_active'];\n  if (hold && hold.state\
                    \ === 'on') return true;\n  return false; })();\n  if (!false) return 'lock.unlock';\n  return isOpen\
                    \ ? 'lock.lock' : 'lock.unlock';\n]]]"
                  service_data:
                    entity_id: lock.gate_intercom_gate_open
                triggers_update:
                - lock.gate_intercom_gate_open
                - binary_sensor.casa_luna_gate_status
                - input_boolean.gate_hold_active
                styles:
                  grid:
                  - grid-template-areas: '''i n'' ''i l'''
                  - grid-template-columns: 52px 1fr
                  - grid-template-rows: min-content min-content
                  - column-gap: 12px
                  img_cell:
                  - border-radius: 16px
                  - width: 52px
                  - height: 52px
                  - place-self: center
                  - background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 12%, transparent)
                  entity_picture:
                  - width: 30px
                  - height: 30px
                  - object-fit: contain
                state:
                - operator: template
                  value: "[[[\n  if (entity.state === 'unlocked' || entity.state === 'opening') return true;\n  const st =\
                    \ states['binary_sensor.casa_luna_gate_status'];\n  if (st && st.state === 'on') return true;\n  const\
                    \ hold = states['input_boolean.gate_hold_active'];\n  if (hold && hold.state === 'on') return true;\n\
                    \  return false;\n]]]"
                  styles:
                    card:
                    - background: 'color-mix(in srgb, #F2B8B5 42%, var(--md-sys-color-surface-container) 58%)'
                    - border: 1px solid rgba(242, 184, 181, 0.85)
                    img_cell:
                    - background-color: '#5C1010'
                    - box-shadow: '0 0 0 1px #5C1010'
                    label:
