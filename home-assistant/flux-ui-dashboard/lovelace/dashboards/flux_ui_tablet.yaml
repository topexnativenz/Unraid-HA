                \ || '')).toLowerCase();\n      if (cls !== 'humidity' && !hay.includes('humidity')) continue;\n      if (keywords.some(k\
                \ => hay.includes(k))) { humidId = eid; break; }\n    }\n  }\n  if (humidId && states[humidId] && !['unavailable','unknown'].includes(states[humidId].state))\
                \ {\n    const v = parseFloat(states[humidId].state);\n    parts.push(Number.isFinite(v) ? v.toFixed(1) +\
                \ '%' : states[humidId].state + '%');\n  }\n  const sub = parts.length ? parts.join(' / ') : (variables.subtitle\
                \ || '');\n  return `\n    <div style=\"position:relative;z-index:2;text-align:left;line-height:1.2;max-width:100%;\"\
                >\n      <div style=\"font-weight:700;font-size:15px;color:var(--md-sys-color-on-surface);word-break:break-word;\"\
