# Flux UI Cameras — global feeds and optional room assignment.
# room: matches rooms.yaml path slug (e.g. entry, garage, living)
# lights: optional entities shown as picture-glance chips under the feed (tablet home)

cameras: []
# Example (Eufy / generic camera entities):
#   - entity: camera.driveway
#     name: Driveway
#     room: garage
#     lights:
#       - light.outside_garage
#       - light.garage
#   - entity: camera.front_door
#     name: Front door
#     room: entry
#     lights:
#       - light.outside_entry
#       - light.entry_centre
#   - entity: camera.garage
#     name: Garage
#     room: garage
#     lights:
#       - light.garage
#   - entity: camera.backyard
#     name: Backyard
#     room: living
#     lights:
#       - light.walkway

# When true and auto-entities is installed, append all camera.* entities not listed above.
# Tablet overview shows up to 4 feeds (manual first, then auto-discover).
auto_discover: true
