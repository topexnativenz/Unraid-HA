# Flux UI Cameras — global feeds and optional room assignment.
# room: matches rooms.yaml path slug (e.g. entry, garage, living)
#
# Eufy: only Driveway (camera.side_door) is kept enabled in the integration.
# Other Eufy camera devices are disabled in HA (user) to reduce clutter.
# Reolink Duo 3 PoE → camera.back_courtyard_fluent.

cameras:
  - entity: camera.back_courtyard_fluent
    name: Back Courtyard
    room: outdoor
  - entity: camera.side_door
    name: Driveway
    room: outdoor
  - entity: camera.front_door_doorbell
    name: Front door Doorbell
    room: entry
  - entity: camera.garage_door
    name: Garage Door
    room: garage

# When true and auto-entities is installed, append all camera.* entities not listed above.
auto_discover: false
