# Flux UI Cameras — global feeds and optional room assignment.
# Tablet overview uses ONLY this curated list (exactly one landscape row of 4).

cameras:
  # Friendly names match the wall-tablet overview (Driveway / Front door / Front Yard / Garage).
  # side_door is the driveway Eufy (HA labels binary_sensor.side_door_* as "Driveway").
  - entity: camera.side_door
    name: Driveway
  - entity: camera.front_door_doorbell
    name: Front door Doorbell
  - entity: camera.front_yard
    name: Front Yard
  - entity: camera.garage_door
    name: Garage Door

# Never auto-append every camera.* onto the tablet overview.
auto_discover: false
