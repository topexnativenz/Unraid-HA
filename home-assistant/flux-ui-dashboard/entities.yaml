# Entity map for Flux UI overview — mirrors home-assistant/mobile-dashboard Home tab.
# Climate section is copied from live Mobile Home on deploy when SMB is available.
# Weather: NZ MetService (ciejer/metservice-weather). Deploy discover_weather.py --apply
# rewrites to the live entity if the ID differs.

weather: weather.homemetservice

# Optional entities for the 16:9 tablet climate panel (ElementZoom landscape home).
# Leave blank to use MetService weather only; set when house sensors exist.
tablet:
  # indoor_temperature: sensor.house_average_temperature
  # outdoor_temperature: sensor.outdoor_temperature
  # climate_entity: climate.heat_pump
  outdoor_temperature: weather.homemetservice
  # MQTT AndroidTablet (rk3576_u) Controls → RGB (see packages/flux_ui_tablet_led.yaml).
  # Discovery entity_id is light.rk3576_u_rk3576_u_rgb (not light.rk3576_u_rgb).
  rgb_led: light.rk3576_u_rk3576_u_rgb
  # Single overview camera row (4 feeds — same width as Tesla band below).
  # Tiles show last-stream JPEGs from /local/flux-ui/camera-stills/ (see package).
  # Reolink tap → bubble live. Eufy tap → wake-then-live subview (needs stream:).
  overview_cameras:
    - entity: camera.back_courtyard_fluent
      name: Back Courtyard
    - entity: camera.side_door
      name: Driveway
      stream: sensor.side_door_rtsp_stream_url
    - entity: camera.side_of_house
      name: Side of House
      stream: sensor.side_of_house_rtsp_stream_url
    - entity: camera.garage_door
      name: Garage Door
      stream: sensor.garage_door_rtsp_stream_url

# Tessie / Tesla tiles — under the camera row (2 equal columns).
# Prefer live Tessie entity IDs from this house (Model S = model_s_p100d_*, Model X = x_*).
tablet_tesla:
  model_s:
    name: Model S
    battery: sensor.model_s_p100d_battery_level
    charging: sensor.model_s_p100d_charging
    charger_power: sensor.model_s_p100d_charger_power
    image: model-s-white.webp
  model_x:
    name: Model X
    battery: sensor.x_battery_level
    charging: sensor.x_charging
    charger_power: sensor.x_charger_power
    image: model-x-blue.webp

quick_actions:
  gate:
    # Akuvox locks are momentary pulses (~5 s). UI state uses the contact /
    # hold entities so "Open" stays while the driveway gate is actually open.
    - entity: lock.gate_intercom_gate_open
      name: Gate Open
      status_entity: binary_sensor.casa_luna_gate_status
      hold_entity: input_boolean.gate_hold_active
      # status on = open (standard door/gate binary_sensor)
      status_on_means_open: true
    - entity: lock.gate_intercom_gate_latch
      name: Gate Latch
      # Latch is also a pulse; show Unlatched while hold is keeping the gate open.
      hold_entity: input_boolean.gate_hold_active
  garage: []
  actions:
    - name: All Off
      subtitle: Turn off all lights
      icon: mdi:lightbulb-off-outline
      icon_color: grey
      service: light.turn_off
      target: light.all_lights
    - name: Goodnight
      subtitle: Night arrival on
      icon: mdi:weather-night
      icon_color: indigo
      service: light.turn_on
      target: light.night_arrival

favourite_lights:
  - entity: light.kitchen
    name: Kitchen
  - entity: light.dining_room
    name: Kitchen dining
  - entity: light.main_atrium
    name: Main area
  - entity: light.garage
    name: Garage
  - entity: light.entry_centre
    name: Entry
  - entity: light.main_footlights
    name: Hall footlights
  - entity: light.all_lights
    name: All lights
  - entity: light.living_center
    name: Living
