# Entity map for Flux UI overview — mirrors home-assistant/mobile-dashboard Home tab.
# Climate section is copied from live Mobile Home on deploy when SMB is available.
# Weather: NZ MetService (ciejer/metservice-weather). Deploy discover_weather.py --apply
# rewrites to the live entity if the ID differs.

weather: weather.homemetservice

# Optional entities for the 16:9 tablet climate panel (ElementZoom landscape home).
# Leave blank to use MetService weather only; set when house sensors exist.
tablet:
  # indoor_temperature: sensor.house_average_temperature
  # outdoor_temperature: sensor.outdoor_temperature
  # climate_entity: climate.heat_pump
  outdoor_temperature: weather.homemetservice

# Tessie / Tesla tiles on the 16:9 tablet overview (under camera row).
# Uses garage_model_* template sensors when present; override IDs if Tessie names differ.
tablet_tesla:
  model_s:
    name: Model S
    battery: sensor.garage_model_s_battery
    charging: sensor.garage_model_s_charging
    charger_power: sensor.garage_model_s_charger_power
    image: model-s-white.png
  model_x:
    name: Model X
    battery: sensor.garage_model_x_battery
    charging: sensor.garage_model_x_charging
    charger_power: sensor.garage_model_x_charger_power
    image: model-x-blue.png

quick_actions:
  gate:
    # Akuvox locks are momentary pulses (~5 s). UI state uses the contact /
    # hold entities so "Open" stays while the driveway gate is actually open.
    - entity: lock.gate_intercom_gate_open
      name: Gate Open
      status_entity: binary_sensor.casa_luna_gate_status
      hold_entity: input_boolean.gate_hold_active
      # status on = open (standard door/gate binary_sensor)
      status_on_means_open: true
    - entity: lock.gate_intercom_gate_latch
      name: Gate Latch
      # Latch is also a pulse; show Unlatched while hold is keeping the gate open.
      hold_entity: input_boolean.gate_hold_active
  garage: []
  actions:
    - name: All Off
      subtitle: Turn off all lights
      icon: mdi:lightbulb-off-outline
      icon_color: grey
      service: light.turn_off
      target: light.all_lights
    - name: Goodnight
      subtitle: Night arrival on
      icon: mdi:weather-night
      icon_color: indigo
      service: light.turn_on
      target: light.night_arrival

favourite_lights:
  - entity: light.kitchen
    name: Kitchen
  - entity: light.dining_room
    name: Kitchen dining
  - entity: light.main_atrium
    name: Main area
  - entity: light.garage
    name: Garage
  - entity: light.entry_centre
    name: Entry
  - entity: light.main_footlights
    name: Hall footlights
  - entity: light.all_lights
    name: All lights
  - entity: light.living_center
    name: Living
