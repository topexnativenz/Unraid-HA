# Generated by generate_weather_package.py — MetService NZ weather (no local weather station).
# Data source: ciejer/metservice-weather + weather.get_forecasts

template:
  # Hourly forecast — feeds Rainfall / UV / Wind charts and summary sensors.
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.metservice
        data:
          type: hourly
        response_variable: forecast
    sensor:
      - name: Flux UI Hourly Forecast Full
        unique_id: flux_ui_hourly_forecast_full
        state: >
          {% set wx = 'weather.metservice' %}
          {% if forecast[wx].forecast is defined and forecast[wx].forecast | length > 0 %}
            {{ forecast[wx].forecast[0].datetime }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          forecasts: >
            {{ forecast['weather.metservice'].forecast | default([], true) | tojson }}

  # Daily forecast — Forecast tab high/low card.
  - triggers:
      - trigger: time_pattern
        hours: "/1"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.metservice
        data:
          type: daily
        response_variable: forecast_daily
    sensor:
      - name: Flux UI Daily Forecast Data
        unique_id: flux_ui_daily_forecast_data
        state: >
          {% if forecast_daily['weather.metservice'].forecast is defined
                and forecast_daily['weather.metservice'].forecast | length > 0 %}
            {{ forecast_daily['weather.metservice'].forecast[0].datetime }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          forecast_data: >
            {% if forecast_daily['weather.metservice'].forecast is defined
                  and forecast_daily['weather.metservice'].forecast | length > 0 %}
              {{ forecast_daily['weather.metservice'].forecast[0] | tojson }}
            {% else %}
              {}
            {% endif %}

  - sensor:
      - name: Flux UI Forecast UV Index
        unique_id: flux_ui_forecast_uv_index
        unit_of_measurement: UV
        state: >
          {% set raw = states('weather.metservice') | default('', true) | lower %}
          {% set mapped = {
            'low': 2, 'moderate': 5, 'high': 8, 'very high': 10, 'extreme': 11,
            'status-low': 2, 'status-moderate': 5, 'status-high': 8
          }.get(raw, none) %}
          {% if mapped is not none %}
            {{ mapped }}
          {% else %}
            {{ raw | float(0) }}
          {% endif %}

      - name: Flux UI Forecast Cloud Coverage
        unique_id: flux_ui_forecast_cloud_coverage
        unit_of_measurement: "%"
        state: >
          {% set raw = state_attr('sensor.flux_ui_hourly_forecast_full', 'forecasts') %}
          {% set f = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) %}
          {% set cond = state('weather.metservice') | lower %}
          {% if f | count > 0 and f[0].cloud_coverage is defined and f[0].cloud_coverage is not none %}
            {{ f[0].cloud_coverage }}
          {% elif cond in ['sunny','clear','clear-night'] %}15
          {% elif cond in ['partlycloudy','partly cloudy','partly-cloudy'] %}45
          {% elif cond in ['cloudy','fog','foggy'] %}75
          {% elif cond in ['rainy','pouring','drizzle'] %}90
          {% else %}60
          {% endif %}

      - name: Flux UI Forecast Rainfall
        unique_id: flux_ui_forecast_rainfall
        unit_of_measurement: mm
        state: >
          {% set raw = state_attr('sensor.flux_ui_hourly_forecast_full', 'forecasts') %}
          {% set f = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) %}
          {% if f | count > 0 and f[0].precipitation is defined %}
            {{ f[0].precipitation }}
          {% else %}
            0
          {% endif %}

      - name: Flux UI Forecast Wind Speed
        unique_id: flux_ui_forecast_wind_speed
        unit_of_measurement: km/h
        state: >
          {{ states('weather.metservice') | default(state_attr('weather.metservice', 'wind_speed'), true) | default('unknown') }}

      - name: Flux UI Forecast Wind Direction
        unique_id: flux_ui_forecast_wind_direction
        unit_of_measurement: "°"
        state: >
          {% set dirs = {
            'N':0,'NNE':22.5,'NE':45,'ENE':67.5,'E':90,'ESE':112.5,'SE':135,'SSE':157.5,
            'S':180,'SSW':202.5,'SW':225,'WSW':247.5,'W':270,'WNW':292.5,'NW':315,'NNW':337.5
          } %}
          {% set raw = states('weather.metservice') | default(state_attr('weather.metservice', 'wind_bearing'), true) %}
          {{ dirs.get(raw | string | upper, raw | float(0)) }}

      - name: Flux UI Forecast Temperature
        unique_id: flux_ui_forecast_temperature
        unit_of_measurement: "°C"
        state: >
          {{ states('weather.metservice') | default(state_attr('weather.metservice', 'temperature'), true) | default('unknown') }}

      - name: Flux UI Next Rain Summary
        unique_id: flux_ui_next_rain_summary
        state: >
          {%- set raw = state_attr('sensor.flux_ui_hourly_forecast_full','forecasts') -%}
          {%- set forecasts = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) -%}
          {%- if forecasts | count > 0 -%}
          {%- set rain_forecasts = forecasts | selectattr('precipitation','defined') | selectattr('precipitation','gt',0) | list -%}
          {%- if rain_forecasts | count > 0 -%}
          {%- set next_rain = rain_forecasts | first -%}
          {%- set val = next_rain.precipitation | float -%}
          {%- set unit = state_attr('weather.metservice', 'precipitation_unit') | default('mm') -%}
          {%- if val < 2.5 -%}🌦️ Light · {{ val | round(1) }} {{ unit }} · {{ as_datetime(next_rain.datetime).strftime('%a, %b %d at %I:%M %p') }}
          {%- elif val < 7.6 -%}🌧️ Moderate · {{ val | round(1) }} {{ unit }} · {{ as_datetime(next_rain.datetime).strftime('%a, %b %d at %I:%M %p') }}
          {%- elif val < 35 -%}⛈️ Heavy · {{ val | round(1) }} {{ unit }} · {{ as_datetime(next_rain.datetime).strftime('%a, %b %d at %I:%M %p') }}
          {%- else -%}⛈️ Very heavy · {{ val | round(1) }} {{ unit }} · {{ as_datetime(next_rain.datetime).strftime('%a, %b %d at %I:%M %p') }}
          {%- endif -%}
          {%- else -%}🌤️ No rain today{%- endif -%}
          {%- else -%}🌤️ N/A{%- endif -%}

      - name: Flux UI 24h Rainfall Summary
        unique_id: flux_ui_24h_rainfall_summary
        state: >
          {%- set raw = state_attr('sensor.flux_ui_hourly_forecast_full','forecasts') -%}
          {%- set forecasts = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) -%}
          {%- if forecasts | count > 0 -%}
          {%- set values = forecasts | map(attribute='precipitation') | map('float') | list -%}
          {%- set total = values | sum -%}
          {%- set peak = values | max -%}
          {%- set peak_entry = forecasts | selectattr('precipitation','eq', peak) | list | first -%}
          {%- set unit = state_attr('weather.metservice', 'precipitation_unit') | default('mm') -%}
          {%- if total == 0 -%}🌤️ Rainfall: None expected in the next 24 hours
          {%- else -%}
          {%- if total < 2.5 -%}{%- set category = 'Light' -%}{%- set emoji = '🌦️' -%}
          {%- elif total < 7.6 -%}{%- set category = 'Moderate' -%}{%- set emoji = '🌧️' -%}
          {%- elif total < 35 -%}{%- set category = 'Heavy' -%}{%- set emoji = '⛈️' -%}
          {%- else -%}{%- set category = 'Very heavy' -%}{%- set emoji = '🌊' -%}{%- endif -%}
          {{ emoji }} Rainfall: {{ total | round(1) }} {{ unit }} ({{ category }}), peaking {{ peak | round(1) }} {{ unit }}/hr on {{ as_datetime(peak_entry.datetime).strftime('%a, %b %d at %I:%M %p') }}.
          {%- endif -%}
          {%- else -%}🌤️ Rainfall: N/A{%- endif -%}

      - name: Flux UI UV and Cloud Summary
        unique_id: flux_ui_uv_and_cloud_summary
        state: >
          {%- set raw = state_attr('sensor.flux_ui_hourly_forecast_full','forecasts') -%}
          {%- set forecasts = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) -%}
          {%- if forecasts | count > 0 -%}
          {%- set uv_values = forecasts | map(attribute='uv_index') | reject('eq', none) | map('float') | list -%}
          {%- set peak_uv = (uv_values | max) if uv_values | count > 0 else (states('sensor.flux_ui_forecast_uv_index') | float(0)) -%}
          {%- set peak_entry = forecasts | selectattr('uv_index','eq', peak_uv) | list | first if uv_values | count > 0 else forecasts | first -%}
          {%- set cloud_values = forecasts | map(attribute='cloud_coverage') | reject('eq', none) | map('float') | list -%}
          {%- set avg_cloud = (cloud_values | sum / cloud_values | length) if cloud_values | count > 0 else (states('sensor.flux_ui_forecast_cloud_coverage') | float(60)) -%}
          {%- if peak_uv < 3 -%}{%- set uv_category = 'Low' -%}{%- set uv_emoji = '🟢' -%}
          {%- elif peak_uv < 6 -%}{%- set uv_category = 'Moderate' -%}{%- set uv_emoji = '🟡' -%}
          {%- elif peak_uv < 8 -%}{%- set uv_category = 'High' -%}{%- set uv_emoji = '🟠' -%}
          {%- elif peak_uv < 11 -%}{%- set uv_category = 'Very High' -%}{%- set uv_emoji = '🔴' -%}
          {%- else -%}{%- set uv_category = 'Extreme' -%}{%- set uv_emoji = '🟣' -%}{%- endif -%}
          {%- if avg_cloud <= 25 -%}{%- set cloud_category = 'Clear' -%}{%- set cloud_emoji = '☀️' -%}
          {%- elif avg_cloud <= 50 -%}{%- set cloud_category = 'Partly Cloudy' -%}{%- set cloud_emoji = '🌤️' -%}
          {%- elif avg_cloud <= 75 -%}{%- set cloud_category = 'Mostly Cloudy' -%}{%- set cloud_emoji = '⛅' -%}
          {%- else -%}{%- set cloud_category = 'Overcast' -%}{%- set cloud_emoji = '☁️' -%}{%- endif -%}
          {{ uv_emoji }} Peak UV: {{ peak_uv | round(1) }} ({{ uv_category }}), {{ cloud_emoji }} Avg Cloud: {{ avg_cloud | round(0) }}% ({{ cloud_category }}), peaking at {{ as_datetime(peak_entry.datetime).strftime('%a, %b %d at %I:%M %p') if peak_entry else 'N/A' }}.
          {%- else -%}🌤️ UV & Cloud Forecast: N/A{%- endif -%}

      - name: Flux UI Wind Summary
        unique_id: flux_ui_wind_summary
        state: >
          {%- set raw = state_attr('sensor.flux_ui_hourly_forecast_full','forecasts') -%}
          {%- set forecasts = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) -%}
          {%- if forecasts | count > 0 -%}
          {%- set speeds = forecasts | map(attribute='wind_speed') | map('float') | list -%}
          {%- set peak = speeds | max -%}
          {%- set peak_entry = forecasts | selectattr('wind_speed','eq', peak) | list | first -%}
          {%- set bearings = forecasts | map(attribute='wind_bearing') | map('float') | list -%}
          {%- set avg_bearing = (bearings | sum / bearings | length) if bearings | count > 0 else 0 -%}
          {%- set direction = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][(avg_bearing / 22.5) | round(0) % 16] -%}
          {%- if peak < 2 -%}{%- set category = 'Calm' -%}{%- set emoji = '🌫️' -%}
          {%- elif peak < 6 -%}{%- set category = 'Light breeze' -%}{%- set emoji = '🍃' -%}
          {%- elif peak < 12 -%}{%- set category = 'Gentle breeze' -%}{%- set emoji = '🌿' -%}
          {%- elif peak < 20 -%}{%- set category = 'Moderate breeze' -%}{%- set emoji = '🌬️' -%}
          {%- elif peak < 29 -%}{%- set category = 'Fresh breeze' -%}{%- set emoji = '💨' -%}
          {%- elif peak < 39 -%}{%- set category = 'Strong breeze' -%}{%- set emoji = '💨' -%}
          {%- elif peak < 50 -%}{%- set category = 'Near gale' -%}{%- set emoji = '🌪️' -%}
          {%- elif peak < 62 -%}{%- set category = 'Gale' -%}{%- set emoji = '🌪️' -%}
          {%- elif peak < 75 -%}{%- set category = 'Strong gale' -%}{%- set emoji = '🌪️' -%}
          {%- else -%}{%- set category = 'Storm' -%}{%- set emoji = '🌀' -%}{%- endif -%}
          {{ emoji }} Winds: {{ peak | round(1) }} {{ state_attr('weather.metservice', 'wind_speed_unit') | default('km/h') }} ({{ category }}), mostly from {{ direction }}, peaking at {{ as_datetime(peak_entry.datetime).strftime('%a, %b %d at %I:%M %p') }}.
          {%- else -%}🌤️ Winds: N/A{%- endif -%}

      - name: Flux UI Moon Summary
        unique_id: flux_ui_moon_summary
        state: >
          🌙 Lunar phase from coordinates — see Lunar tab (no local sensor required)
