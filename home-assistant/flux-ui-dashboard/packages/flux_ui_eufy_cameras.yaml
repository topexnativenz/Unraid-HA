# Flux UI — Eufy outdoor cameras (Three Mile Bush HomeBase).
#
# Overview tiles use image.*_event_image stills. Live WebRTC needs RTSP after
# camera.turn_on (battery cams reject DESCRIBE until awake). This package:
#   - keeps outdoor RTSP switches on
#   - provides start helpers used by the tablet live subviews
#
# Included from configuration.yaml: homeassistant: packages: !include_dir_named packages

script:
  flux_ui_eufy_start_stream:
    alias: Flux UI — start Eufy outdoor stream
    icon: mdi:cctv
    mode: parallel
    max: 3
    fields:
      camera_entity:
        description: Camera entity_id (e.g. camera.side_door)
        example: camera.side_door
      rtsp_switch:
        description: RTSP switch entity_id
        example: switch.side_door_rtsp_stream
    sequence:
      - condition: template
        value_template: >
          {{ camera_entity is defined and camera_entity[:7] == 'camera.' }}
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ rtsp_switch }}"
      - action: camera.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ camera_entity }}"
      - wait_template: >
          {{ is_state('sensor.' ~ camera_entity.split('.')[1] ~ '_stream_status',
                      'StreamStatus.STREAMING') }}
        timeout: "00:00:45"
        continue_on_timeout: true

automation:
  - id: flux_ui_eufy_rtsp_keep_on
    alias: Flux UI — keep Eufy outdoor RTSP enabled
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - switch.side_door_rtsp_stream
          - switch.garage_door_rtsp_stream
          - switch.side_of_house_rtsp_stream
        to: "off"
        for:
          minutes: 2
    action:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id:
            - switch.side_door_rtsp_stream
            - switch.garage_door_rtsp_stream
            - switch.side_of_house_rtsp_stream
