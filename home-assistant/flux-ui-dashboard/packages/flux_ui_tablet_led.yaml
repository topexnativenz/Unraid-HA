# Flux UI — rk3576_u tablet MQTT RGB LED pulses green while a Tesla is charging.
# Matches the Tesla card charging glow on /flux-ui-tablet.
#
# MQTT discovery names this light light.rk3576_u_rk3576_u_rgb (device + object id).
# Older docs used light.rk3576_u_rgb — that entity does not exist on this HA.
# Override via input_text.flux_ui_tablet_rgb_led if needed (requires HA restart
# the first time the helper is added from this package).
#
# Included from configuration.yaml: homeassistant: packages: !include_dir_named packages

input_text:
  flux_ui_tablet_rgb_led:
    name: Flux UI tablet RGB LED entity
    initial: light.rk3576_u_rk3576_u_rgb
    max: 255
    icon: mdi:led-strip

template:
  - binary_sensor:
      - name: Flux UI EV charging
        unique_id: flux_ui_ev_charging
        icon: mdi:ev-station
        # Same charging tokens as flux_tablet_tesla.py (charging / connected / on).
        state: >
          {% set s = states('sensor.model_s_p100d_charging') | lower %}
          {% set x = states('sensor.x_charging') | lower %}
          {{ s in ['charging', 'connected', 'on']
             or x in ['charging', 'connected', 'on'] }}
  - sensor:
      # Resolve the live MQTT RGB light even if input_text is missing / stale.
      - name: Flux UI tablet RGB LED resolved
        unique_id: flux_ui_tablet_rgb_led_resolved
        icon: mdi:led-strip
        state: >
          {% set configured = states('input_text.flux_ui_tablet_rgb_led') | trim %}
          {% set candidates = [
            configured,
            'light.rk3576_u_rk3576_u_rgb',
            'light.rk3576_u_rgb',
            'light.rk3576_u_led',
            'light.rk3576_u_rgb_led',
            'light.androidtablet_rgb',
          ] %}
          {% set ns = namespace(led='') %}
          {% for c in candidates if c and c.startswith('light.') %}
            {% if states(c) not in ['unknown', 'unavailable', none, ''] and ns.led == '' %}
              {% set ns.led = c %}
            {% endif %}
          {% endfor %}
          {% if ns.led == '' %}
            {% for s in states.light %}
              {% if ns.led == ''
                   and 'rk3576' in s.entity_id
                   and 'rgb' in s.entity_id
                   and s.state not in ['unknown', 'unavailable', none, ''] %}
                {% set ns.led = s.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.led if ns.led else 'light.rk3576_u_rk3576_u_rgb' }}

script:
  flux_ui_tablet_led_charge_pulse:
    alias: Flux UI tablet LED — EV charge green pulse
    icon: mdi:battery-charging
    mode: restart
    sequence:
      - variables:
          led: "{{ states('sensor.flux_ui_tablet_rgb_led_resolved') | trim }}"
      - condition: template
        value_template: >
          {{ led.startswith('light.')
             and states(led) not in ['unknown', 'unavailable', none, ''] }}
      - repeat:
          while:
            - condition: state
              entity_id: binary_sensor.flux_ui_ev_charging
              state: "on"
            - condition: template
              value_template: >
                {{ states(led) not in ['unknown', 'unavailable', none, ''] }}
          sequence:
            # Soft breathe — narrow brightness band + long holds.
            # This MQTT strip ignores transition; avoid stepped ramps (too flashy).
            - action: light.turn_on
              target:
                entity_id: "{{ led }}"
              data:
                rgb_color: [0, 255, 0]
                brightness: 175
                transition: 3
            - delay:
                seconds: 3
            - action: light.turn_on
              target:
                entity_id: "{{ led }}"
              data:
                rgb_color: [0, 255, 0]
                brightness: 95
                transition: 3
            - delay:
                seconds: 3

automation:
  - id: flux_ui_tablet_led_charge_pulse_start
    alias: Flux UI tablet LED — start green pulse when EV charging
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.flux_ui_ev_charging
        to: "on"
      - platform: homeassistant
        event: start
      # Re-arm when the resolved MQTT RGB light entity_id becomes valid.
      - platform: state
        entity_id: sensor.flux_ui_tablet_rgb_led_resolved
      # Re-arm on Tessie charging changes (covers template lag / missed to:on).
      - platform: state
        entity_id:
          - sensor.x_charging
          - sensor.model_s_p100d_charging
    condition:
      - condition: state
        entity_id: binary_sensor.flux_ui_ev_charging
        state: "on"
      - condition: template
        value_template: >
          {% set led = states('sensor.flux_ui_tablet_rgb_led_resolved') | trim %}
          {{ led.startswith('light.')
             and states(led) not in ['unknown', 'unavailable', none, ''] }}
    action:
      - action: script.turn_on
        target:
          entity_id: script.flux_ui_tablet_led_charge_pulse

  - id: flux_ui_tablet_led_charge_pulse_stop
    alias: Flux UI tablet LED — stop pulse when EV not charging
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.flux_ui_ev_charging
        to: "off"
    action:
      - action: script.turn_off
        target:
          entity_id: script.flux_ui_tablet_led_charge_pulse
      - variables:
          led: "{{ states('sensor.flux_ui_tablet_rgb_led_resolved') | trim }}"
      - if:
          - condition: template
            value_template: >
              {{ led.startswith('light.')
                 and states(led) not in ['unknown', 'unavailable', none, ''] }}
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ led }}"
