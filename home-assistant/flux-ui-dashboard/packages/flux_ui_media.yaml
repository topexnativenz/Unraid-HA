          ''playing'') and ({% set _t = state_attr(''media_player.garage_sonos'',
          ''media_content_type'') | default('''') | lower %}{% set _app = state_attr(''media_player.garage_sonos'',
          ''app_name'') | default('''') | lower %}{% set _artist = state_attr(''media_player.garage_sonos'',
          ''media_artist'') | default('''') %}{% set _series = state_attr(''media_player.garage_sonos'',
          ''media_series_title'') | default('''') %}{{ _t in [''music'', ''artist'',
          ''album'', ''playlist'', ''podcast'', ''track'', ''genre''] or (_artist
          and _t not in [''video'', ''tvshow'', ''movie'', ''channel'', ''episode''])
          or (_artist and not _series) or (_t not in [''video'', ''tvshow'', ''movie'',
          ''channel'', ''episode''] and ''tv'' not in _app and ''hdmi'' not in _app
