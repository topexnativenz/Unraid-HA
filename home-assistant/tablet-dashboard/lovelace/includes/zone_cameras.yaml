# Lower-right: 2x2 camera grid with static placeholder images (demo mode)
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: picture-entity
        title: Backyard
        entity: sensor.tablet_demo_weather
        image: /local/tablet-dashboard/camera-backyard.jpg
        show_name: false
        show_state: false
        aspect_ratio: "16:9"
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              overflow: hidden;
              border: 1px solid rgba(255,255,255,0.1);
              margin: 4px;
              background-size: cover;
            }
            .title {
              color: #fff !important;
              font-weight: 600;
              text-shadow: 0 2px 8px rgba(0,0,0,0.8);
              padding: 8px 12px;
            }
      - type: picture-entity
        title: Front Yard
        entity: sensor.tablet_demo_weather
        image: /local/tablet-dashboard/camera-front-yard.jpg
        show_name: false
        show_state: false
        aspect_ratio: "16:9"
        tap_action:
          action: none
        card_mod:
