              text-shadow: 0 2px 8px rgba(0,0,0,0.8);
              padding: 8px 12px;
            }

  - type: custom:button-card
    icon: mdi:image-filter-center-focus
    show_icon: true
    show_name: false
    show_state: false
    tap_action:
      action: navigate
      navigation_path: /mobile-home/cameras
    styles:
      card:
        - width: 56px
        - height: 56px
        - border-radius: 50%
        - background: rgba(255, 255, 255, 0.92)
        - border: none
        - box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45)
        - margin: "-36px 18px 8px auto"
        - z-index: 5
      icon:
        - color: "#111827"
        - width: 28px
view_layout:
  grid-area: cameras
