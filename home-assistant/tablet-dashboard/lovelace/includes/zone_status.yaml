# Top-right: device status, forecast, radar accordion
type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: tablet_status_chip
        entity: sensor.tablet_lights_on_count
        name: Light
        icon: mdi:lightbulb-on
        state_display: |
          [[[
            return entity.state + ' On';
          ]]]
      - type: custom:button-card
        template: tablet_status_chip
        entity: sensor.tablet_locks_open_count
        name: Lock
        icon: mdi:lock-open-variant
        state_display: |
          [[[
            return entity.state + ' Open';
          ]]]
      - type: custom:button-card
        template: tablet_status_chip
        entity: sensor.tablet_shades_open_count
        name: Shade
        icon: mdi:blinds-open
        state_display: |
          [[[
            return entity.state + ' Open';
          ]]]
      - type: custom:button-card
        template: tablet_status_chip
        entity: sensor.tablet_alarms_active_count
        name: Alarm
        icon: mdi:shield-alert
        state_display: |
          [[[
            return entity.state + ' On';
          ]]]
      - type: custom:button-card
        template: tablet_status_chip
        entity: sensor.tablet_occupancy_on_count
        name: Occupancy
        icon: mdi:account-group
        state_display: |
          [[[
            return entity.state + ' On';
          ]]]

  - type: custom:button-card
    entity: sensor.tablet_demo_weather
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: rgba(255, 255, 255, 0.06)
        - border: 1px solid rgba(255, 255, 255, 0.1)
        - border-radius: 24px
        - backdrop-filter: blur(18px)
        - padding: 14px 18px
    custom_fields:
      forecast: |
        [[[
          const fc = entity.attributes.forecast || [];
          const days = fc.slice(0, 4);
          if (!days.length) {
            return '<div style="color:rgba(255,255,255,0.6);font-size:13px;">No forecast data — check demo weather entity.</div>';
          }
          const icons = {
            sunny: '☀️', clear: '☀️', 'clear-night': '🌙', cloudy: '☁️',
            'partlycloudy': '⛅', rainy: '🌧️', pouring: '🌧️', snowy: '❄️',
            fog: '🌫️', windy: '💨', lightning: '⛈️'
          };
          let html = '';
          days.forEach((d, i) => {
            const low = d.templow ?? d.temperature_low ?? 62;
            const high = d.temperature ?? d.temperature_high ?? 82;
            const span = Math.max(high - low, 1);
            const dot = Math.min(100, Math.max(0, ((72 - low) / span) * 100));
            const day = d.datetime
              ? new Date(d.datetime).toLocaleDateString('en-US', { weekday: 'short' })
              : ['Wed','Thu','Fri','Sat'][i];
            const icon = icons[d.condition] || '⛅';
            html += `
              <div style="display:grid;grid-template-columns:52px 36px 44px 1fr 44px;align-items:center;gap:8px;margin:10px 0;">
                <span style="color:#fff;font-weight:600;font-size:14px;">${day}</span>
                <span style="font-size:20px;">${icon}</span>
                <span style="color:rgba(255,255,255,0.75);font-size:13px;">${Math.round(low)}°</span>
                <div style="height:6px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#4ade80,#fbbf24,#fb7185);position:relative;">
                  <div style="position:absolute;left:${dot}%;top:50%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(255,255,255,0.8);"></div>
                </div>
                <span style="color:#fff;font-weight:700;font-size:13px;text-align:right;">${Math.round(high)}°</span>
              </div>`;
          });
          return html;
        ]]]

  - type: vertical-stack
    cards:
      - type: custom:button-card
        name: Weather Radar
        icon: mdi:chevron-down
        show_icon: true
        show_name: true
        show_state: false
        layout: horizontal
        tap_action:
          action: call-service
          service: input_boolean.toggle
          service_data:
            entity_id: input_boolean.tablet_radar_expanded
        styles:
          card:
            - background: rgba(255, 255, 255, 0.04)
            - border: 1px solid rgba(255, 255, 255, 0.08)
            - border-radius: 18px
            - padding: 12px 16px
          name:
            - color: rgba(255, 255, 255, 0.85)
            - font-size: 14px
            - font-weight: 600
          icon:
            - color: rgba(255, 255, 255, 0.55)
      - type: conditional
        conditions:
          - entity: input_boolean.tablet_radar_expanded
            state: "on"
        card:
          type: picture
          image: /local/tablet-dashboard/radar-placeholder.png
          tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                border-radius: 18px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.08);
              }
view_layout:
  grid-area: status
