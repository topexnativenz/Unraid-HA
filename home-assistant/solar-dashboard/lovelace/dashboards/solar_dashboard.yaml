                - font-size: 10px
                - font-weight: 700
              custom_fields:
                rows:
                  - grid-area: rows
            custom_fields:
              rows: |
                [[[
                  const today = states['sensor.solar_forecast_today']?.state ?? '—';
                  const tomorrow = states['sensor.solar_forecast_tomorrow']?.state ?? '—';
                  return `<motion.div style="font-size:10px;color:#fff;line-height:1.65;margin-top:4px;">
                    <motion.div style="display:flex;justify-content:space-between;gap:6px;"><span style="color:#ffb74d;">Today</span><span>${today} kWh</span></motion.div>
                    <motion.div style="display:flex;justify-content:space-between;gap:6px;"><span style="color:#66bb6a;">Tomorrow</span><span>${tomorrow} kWh</span></motion.div>
                  </motion.div>`.replace(/motion\./g,'');
                ]]]
            card_mod:
              style: |
                :host {
                  right: 5% !important;
                  left: auto !important;
                  width: 148px !important;
                  max-width: 148px !important;
                }
                ha-card {
                  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45)) !important;
                  backdrop-filter: blur(12px) saturate(1.2);
                  -webkit-backdrop-filter: blur(12px) saturate(1.2);
                  border: 1px solid rgba(255, 255, 255, 0.18) !important;
                  border-radius: 12px !important;
                  padding: 8px 10px !important;
                  width: 148px !important;
                  max-width: 148px !important;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
                }
            style:
              top: 5%
              right: 5%
              left: auto
              width: 148px

          - type: custom:button-card
            entity: weather.forecast_home
            name: Weather
            layout: grid
            show_icon: true
            icon: mdi:weather-partly-cloudy
            show_state: false
            styles:
              grid:
                - grid-template-areas: '"i n" "rows rows"'
                - grid-template-columns: 20px 1fr
              card:
                - background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45))
                - backdrop-filter: blur(12px) saturate(1.2)
                - -webkit-backdrop-filter: blur(12px) saturate(1.2)
                - border: 1px solid rgba(255, 255, 255, 0.18)
                - border-radius: 12px
                - padding: 8px 10px
                - width: 148px
                - box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12)
              icon:
                - color: "#f5c842"
                - width: 18px
              name:
                - color: rgba(255,255,255,0.9)
                - font-size: 10px
                - font-weight: 700
              custom_fields:
                rows:
                  - grid-area: rows
            custom_fields:
              rows: |
                [[[
                  const pick = (id) => states[id];
                  const w = pick('weather.forecast_home') || pick(states['input_text.solar_entity_weather']?.state) || pick('weather.home');
                  let fc = w?.attributes?.forecast ?? w?.attributes?.forecast_daily ?? [];
                  if (!fc.length && Array.isArray(w?.attributes?.forecast_hourly)) {
                    const seen = new Set();
                    fc = w.attributes.forecast_hourly.filter((h) => {
                      const d = (h.datetime || '').slice(0, 10);
                      if (!d || seen.has(d)) return false;
                      seen.add(d);
                      return true;
                    }).slice(0, 2);
                  }
                  const today = fc[0] || (w ? { condition: w.state, temperature: w.attributes?.temperature } : null);
                  const tomorrow = fc[1] || null;
                  const row = (label, day) => {
                    if (!day) return `<motion.div style="display:flex;justify-content:space-between;gap:6px;"><span>${label}</span><span>—</span></motion.div>`;
                    const cond = (day.condition || day.state || '—').replace(/_/g, ' ');
                    const temp = day.temperature != null ? Math.round(day.temperature) + '°' : '—';
                    return `<motion.div style="display:flex;justify-content:space-between;gap:6px;"><span style="color:#90caf9;">${label}</span><span style="text-transform:capitalize;">${cond} ${temp}</span></motion.div>`;
                  };
                  return `<motion.div style="font-size:10px;color:#fff;line-height:1.65;margin-top:4px;">${row('Today', today)}${row('Tomorrow', tomorrow)}</motion.div>`.replace(/motion\./g,'');
                ]]]
            card_mod:
              style: |
                :host {
                  right: 5% !important;
                  left: auto !important;
                  width: 148px !important;
                  max-width: 148px !important;
                }
                ha-card {
                  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45)) !important;
                  backdrop-filter: blur(12px) saturate(1.2);
                  -webkit-backdrop-filter: blur(12px) saturate(1.2);
                  border: 1px solid rgba(255, 255, 255, 0.18) !important;
                  border-radius: 12px !important;
                  padding: 8px 10px !important;
                  width: 148px !important;
                  max-width: 148px !important;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
                }
            style:
              top: 19%
              right: 5%
              left: auto
              width: 148px

          - type: custom:button-card
            entity: sensor.grid_import_power
            name: Grid use
            icon: mdi:transmission-tower
            show_icon: true
            show_name: true
            show_state: true
            state_display: |
