                - box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12)
              icon:
                - color: "#f5c842"
                - width: 16px
              name:
                - color: rgba(255,255,255,0.9)
                - font-size: 10px
                - font-weight: 700
              custom_fields:
                ev:
                  - grid-area: ev
            custom_fields:
              ev: |
                [[[
                  const row = (name, soc, pwr, st) => {
                    const charging = ['charging','connected'].includes((st||'').toLowerCase());
                    const pColor = charging ? '#66bb6a' : '#fff';
                    return `<motion.div style="font-size:9px;line-height:1.4;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,0.12);">
                      <motion.div style="font-weight:700;color:#f5c842;margin-bottom:1px;font-size:9px;">${name}</motion.div>
                      <motion.div style="display:flex;justify-content:space-between;color:rgba(255,255,255,0.85);"><span>Batt</span><span>${soc}%</span></motion.div>
                      <motion.div style="display:flex;justify-content:space-between;color:rgba(255,255,255,0.85);"><span>Chg</span><span style="color:${pColor};font-weight:600;">${pwr} kW</span></motion.div>
                      <motion.div style="display:flex;justify-content:space-between;color:rgba(255,255,255,0.65);"><span>St</span><span style="text-transform:capitalize;">${st}</span></motion.div>
                    </motion.div>`;
                  };
                  const sSoc = states['sensor.garage_model_s_battery']?.state ?? '—';
                  const sPwr = states['sensor.garage_model_s_charger_power']?.state ?? '0';
                  const sSt = states['sensor.garage_model_s_charging']?.state ?? '—';
                  const xSoc = states['sensor.garage_model_x_battery']?.state ?? '—';
                  const xPwr = states['sensor.garage_model_x_charger_power']?.state ?? '0';
                  const xSt = states['sensor.garage_model_x_charging']?.state ?? '—';
                  return row('Model S', sSoc, sPwr, sSt) + row('Model X', xSoc, xPwr, xSt);
                ]]]
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45)) !important;
                  backdrop-filter: blur(12px) saturate(1.2);
                  -webkit-backdrop-filter: blur(12px) saturate(1.2);
                  border: 1px solid rgba(255, 255, 255, 0.18) !important;
                  border-radius: 12px 0 0 12px !important;
                  position: relative;
                  overflow: visible;
                  transform-origin: center right;
                  transform: perspective(900px) rotateY(-12deg) rotateX(2deg) skewY(0.8deg) rotateZ(-0.4deg);
                  box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12),
                    inset 10px 0 16px rgba(0, 0, 0, 0.28),
                    -12px 10px 18px rgba(0, 0, 0, 0.35) !important;
                }
                ha-card::after {
                  content: "";
                  position: absolute;
                  top: 10px;
                  bottom: 10px;
                  right: 0;
                  width: 2px;
                  border-radius: 2px;
                  background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.34),
                    rgba(255, 255, 255, 0.06)
                  );
                  opacity: 0.75;
