# 332 Three Mile Bush Road — AI archviz render (v15 backgrounds)
# cache-bust 2026-06-02: v15 — master pixels + weather grades; optional sky tidy
views:
  - title: Solar
    theme: default
    type: panel
    panel: true
    cards:
      - type: picture-elements
        card_mod:
          style: |
            :host {
              display: flex !important;
              align-items: center !important;
              justify-content: center !important;
              height: 100vh !important;
              overflow: hidden !important;
            }
            ha-card {
              width: min(100vw, calc(100vh * 16 / 9)) !important;
              max-width: 100vw !important;
              aspect-ratio: 16 / 9 !important;
              height: auto !important;
              margin: 0 auto !important;
              border: none !important;
              box-shadow: none !important;
              overflow: hidden !important;
              background: #000 !important;
            }
            #root picture-elements,
            picture-elements {
              overflow: hidden !important;
              max-width: 100% !important;
            }
            ha-card img {
              width: 100% !important;
              height: 100% !important;
              object-fit: contain !important;
              object-position: center center !important;
              display: block !important;
            }
        entity: sensor.solar_dashboard_background
        state_image:
          clear: /local/solar-dashboard/backgrounds/v15/clear.jpg?v=20260602b
          cloudy: /local/solar-dashboard/backgrounds/v15/cloudy.jpg?v=20260602b
          covered: /local/solar-dashboard/backgrounds/v15/covered.jpg?v=20260602b
          very_covered: /local/solar-dashboard/backgrounds/v15/very_covered.jpg?v=20260602b
          night: /local/solar-dashboard/backgrounds/v15/night.jpg?v=20260602b
        image: /local/solar-dashboard/backgrounds/v15/clear.jpg?v=20260602b
        elements:
          - type: custom:button-card
            name: Contact Energy TOU
            layout: grid
            show_icon: true
            icon: mdi:flash
            show_state: false
            styles:
              grid:
                - grid-template-areas: '"i n" "rows rows"'
                - grid-template-columns: 20px 1fr
              card:
                - background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45))
                - backdrop-filter: blur(12px) saturate(1.2)
                - -webkit-backdrop-filter: blur(12px) saturate(1.2)
                - border: 1px solid rgba(255, 255, 255, 0.18)
                - border-radius: 12px
                - padding: 8px 10px
                - width: 148px
                - box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12)
              icon:
                - color: "#f5c842"
                - width: 18px
              name:
                - color: rgba(255,255,255,0.9)
                - font-size: 10px
                - font-weight: 700
              custom_fields:
                rows:
                  - grid-area: rows
            custom_fields:
              rows: |
                [[[
                  const peak = states['sensor.contact_tariff_peak_display']?.state ?? '33.5 c/kWh';
                  const off = states['sensor.contact_tariff_offpeak_display']?.state ?? '16.5 c/kWh';
                  return `<motion.div style="font-size:10px;color:#fff;line-height:1.65;margin-top:4px;">
                    <motion.div style="display:flex;justify-content:space-between;gap:6px;"><span style="color:#ffb74d;">Peak 7am–9pm</span><span>${peak}</span></motion.div>
                    <motion.div style="display:flex;justify-content:space-between;gap:6px;"><span style="color:#66bb6a;">Off-peak</span><span>${off}</span></motion.div>
                    <motion.div style="font-size:9px;opacity:0.75;margin-top:4px;">Northpower network</motion.div>
                  </motion.div>`.replace(/motion\./g,'');
                ]]]
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45)) !important;
                  backdrop-filter: blur(12px) saturate(1.2);
                  -webkit-backdrop-filter: blur(12px) saturate(1.2);
                  border: 1px solid rgba(255, 255, 255, 0.18) !important;
                  border-radius: 12px !important;
                  padding: 8px 10px !important;
                  width: 148px !important;
                  max-width: 148px !important;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
                }
            style:
              top: 5%
              left: 5%

          - type: custom:button-card
            entity: sensor.solar_forecast_today
            name: Solar forecast
            layout: grid
            show_icon: true
            icon: mdi:solar-power
            show_state: false
            styles:
              grid:
                - grid-template-areas: '"i n" "rows rows"'
                - grid-template-columns: 20px 1fr
              card:
                - background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(15, 25, 45, 0.45))
                - backdrop-filter: blur(12px) saturate(1.2)
                - -webkit-backdrop-filter: blur(12px) saturate(1.2)
                - border: 1px solid rgba(255, 255, 255, 0.18)
