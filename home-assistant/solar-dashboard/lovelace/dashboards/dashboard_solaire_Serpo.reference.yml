  - type: custom:button-card
    entity: sensor.growatt_spf_battery_power
    show_name: false
    show_icon: false
    show_state: true
    state_display: |
      [[[
        return Math.abs(parseInt(entity.state)) + " W";
      ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0
      state:
        - font-size: 22px
        - font-weight: bold
        - text-shadow: 1px 1px 4px black
        - color: |
            [[[
              return parseFloat(entity.state) >= 0
                ? "#00ff00"
                : "#ff0000";
            ]]]
    style:
      top: 41%
      left: 80%
    tap_action:
      action: none
    hold_action:
      action: none
  - type: state-label
    entity: sensor.growatt_spf_battery_state_of_charge
    style:
      top: 50%
      left: 80%
      color: "#ff5e00"
      font-size: 20px
      font-weight: bold
      text-shadow: 1px 1px 4px black
    tap_action:
      action: none
  - type: state-label
    entity: sensor.growatt_spf_battery_voltage
    style:
      top: 56.5%
      left: 80%
      color: white
      font-size: 20px
      font-weight: bold
      text-shadow: 1px 1px 4px black
    tap_action:
      action: none
  - type: custom:button-card
    entity: sensor.growatt_spf_battery_state_of_charge
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - padding: 0
        - width: 82px
        - height: 210px
        - border-radius: 12px
        - border: none
        - box-shadow: none
        - background: |
            [[[
              let soc = parseInt(entity.state);

              let color = "#ff0000";

              if (soc >= 80)
                color = "#2e7d32";
              else if (soc >= 60)
                color = "#b6ff00";
              else if (soc >= 40)
                color = "#ff9a00";
              else if (soc >= 20)
                color = "#ff5e00";
              else
                color = "#ff0000";

              let fill = Math.min(soc * 1.12, 100);

              return `
                linear-gradient(
                  to top,
                  ${color} 0%,
                  ${color} ${fill}%,
                  transparent ${fill}%,
                  transparent 100%
                )
              `;
            ]]]
    style:
      top: 45%
      left: 90.5%
      opacity: 0.92
    tap_action:
      action: none
    hold_action:
      action: none
  - type: state-label
