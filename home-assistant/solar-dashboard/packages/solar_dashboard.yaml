# Solar dashboard — template sensors, background selector, demo helpers
# Merge into HA: /config/packages/solar-dashboard.yaml

input_boolean:
  solar_dashboard_demo:
    name: Solar dashboard demo mode
    icon: mdi:solar-power

# ---------------------------------------------------------------------------
# When your inverter is live, set these to your real entity IDs (or use
# customize.yaml). Templates below read from these attributes.
# ---------------------------------------------------------------------------
input_text:
  solar_entity_roof_power:
    name: Solar entity — roof power
    initial: sensor.solar_roof_power
    max: 255
  solar_entity_ground_power:
    name: Solar entity — ground power
    initial: sensor.solar_ground_power
    max: 255
  solar_entity_battery_power:
    name: Solar entity — battery power
    initial: sensor.solar_battery_power
    max: 255
  solar_entity_battery_soc:
    name: Solar entity — battery SOC
    initial: sensor.solar_battery_soc
    max: 255
  solar_entity_battery_voltage:
    name: Solar entity — battery voltage
    initial: sensor.solar_battery_voltage
    max: 255
  solar_entity_grid_import:
    name: Solar entity — grid import power
    initial: sensor.grid_import_power
    max: 255
  solar_entity_grid_voltage:
    name: Solar entity — grid voltage
    initial: sensor.grid_voltage
    max: 255
  solar_entity_inverter_temp:
    name: Solar entity — inverter temperature
    initial: sensor.inverter_temperature
    max: 255
  solar_entity_battery_cycles:
    name: Solar entity — battery cycles
    initial: sensor.battery_cycle_count
    max: 255
  solar_entity_pv_total_today:
    name: Solar entity — PV total today
    initial: sensor.solar_pv_total_today
    max: 255
  solar_entity_home_consumption:
    name: Solar entity — home consumption
    initial: sensor.home_consumption_power
    max: 255
  solar_entity_production_today:
    name: Solar entity — production today
    initial: sensor.solar_production_today
    max: 255
  solar_entity_production_month:
    name: Solar entity — production month
    initial: sensor.solar_production_month
    max: 255
  solar_entity_production_year:
    name: Solar entity — production year
    initial: sensor.solar_production_year
    max: 255
  solar_entity_forecast_today:
    name: Solar entity — forecast today
    initial: sensor.solar_forecast_today
    max: 255
  solar_entity_forecast_tomorrow:
    name: Solar entity — forecast tomorrow
    initial: sensor.solar_forecast_tomorrow
    max: 255
  solar_entity_weather:
    name: Solar entity — weather
    initial: weather.forecast_home
    max: 255

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - input_boolean.solar_dashboard_demo
          - input_text.solar_entity_weather
          - weather.forecast_home
          - sun.sun
    sensor:
      # --- Background scene key (used by picture-elements image path) ---
      - name: Solar dashboard background
        unique_id: solar_dashboard_background
        icon: mdi:image-filter-hdr
        state: >
          {% set weather_entity = states('input_text.solar_entity_weather') %}
          {% set wx = states(weather_entity) %}
          {% set elev = state_attr('sun.sun', 'elevation') | float(-6) %}
          {% if elev < -1 %}
            night
          {% elif wx in ['lightning-rainy', 'lightning', 'hail', 'exceptional'] %}
            very_covered
          {% elif wx in ['rainy', 'pouring', 'snowy-rainy', 'snowy', 'fog', 'cloudy'] %}
            covered
          {% elif wx in ['partlycloudy', 'windy', 'windy-variant'] %}
            cloudy
          {% else %}
            clear
          {% endif %}

      # --- Demo / passthrough helpers ---
      - name: Solar roof power
        unique_id: solar_roof_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ (now().hour * 180 + now().minute * 3) | int % 4200 }}
          {% else %}
            {{ states(states('input_text.solar_entity_roof_power')) | float(0) | round(0) }}
          {% endif %}

      - name: Solar ground power
        unique_id: solar_ground_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ (now().hour * 120 + now().minute * 2) | int % 2800 }}
          {% else %}
            {{ states(states('input_text.solar_entity_ground_power')) | float(0) | round(0) }}
          {% endif %}

      - name: Solar battery power
        unique_id: solar_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ ((now().minute * 47) % 2200) - 400 }}
          {% else %}
            {{ states(states('input_text.solar_entity_battery_power')) | float(0) | round(0) }}
          {% endif %}

      - name: Solar battery SOC
        unique_id: solar_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ 55 + ((now().hour + now().minute / 60) * 2.5) | int % 35 }}
          {% else %}
            {{ states(states('input_text.solar_entity_battery_soc')) | float(0) | round(0) }}
          {% endif %}

      - name: Solar battery voltage
        unique_id: solar_battery_voltage
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            51.2
          {% else %}
            {{ states(states('input_text.solar_entity_battery_voltage')) | float(0) | round(1) }}
          {% endif %}

      - name: Grid import power
        unique_id: grid_import_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ (now().minute * 13) % 900 }}
          {% else %}
            {{ states(states('input_text.solar_entity_grid_import')) | float(0) | round(0) }}
          {% endif %}

      - name: Grid voltage
        unique_id: grid_voltage
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            240
          {% else %}
            {{ states(states('input_text.solar_entity_grid_voltage')) | float(0) | round(0) }}
          {% endif %}

      - name: Inverter temperature
        unique_id: inverter_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ 24 + (now().hour / 2) | round(1) }}
          {% else %}
            {{ states(states('input_text.solar_entity_inverter_temp')) | float(0) | round(1) }}
          {% endif %}

      - name: Battery cycle count
        unique_id: battery_cycle_count
        state_class: total_increasing
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            293
          {% else %}
            {{ states(states('input_text.solar_entity_battery_cycles')) | int(0) }}
          {% endif %}

      - name: Solar PV total today
        unique_id: solar_pv_total_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ (now().hour * 1.6 + now().minute / 40) | round(2) }}
          {% else %}
            {{ states(states('input_text.solar_entity_pv_total_today')) | float(0) | round(2) }}
          {% endif %}

      - name: Home consumption power
        unique_id: home_consumption_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ 800 + (now().minute * 19) % 900 }}
          {% else %}
            {{ states(states('input_text.solar_entity_home_consumption')) | float(0) | round(0) }}
          {% endif %}

      - name: Solar production today
        unique_id: solar_production_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            {{ (now().hour * 1.55 + now().minute / 38) | round(2) }}
          {% else %}
            {{ states(states('input_text.solar_entity_production_today')) | float(0) | round(2) }}
          {% endif %}

      - name: Solar production month
        unique_id: solar_production_month
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            532.5
          {% else %}
            {{ states(states('input_text.solar_entity_production_month')) | float(0) | round(2) }}
          {% endif %}

      - name: Solar production year
        unique_id: solar_production_year
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            2106.1
          {% else %}
            {{ states(states('input_text.solar_entity_production_year')) | float(0) | round(1) }}
          {% endif %}

      - name: Solar forecast today
        unique_id: solar_forecast_today
        unit_of_measurement: kWh
        device_class: energy
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            36.72
          {% else %}
            {{ states(states('input_text.solar_entity_forecast_today')) | float(0) | round(2) }}
          {% endif %}

      - name: Solar forecast tomorrow
        unique_id: solar_forecast_tomorrow
        unit_of_measurement: kWh
        device_class: energy
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            34.27
          {% else %}
            {{ states(states('input_text.solar_entity_forecast_tomorrow')) | float(0) | round(2) }}
          {% endif %}

      # Optional tariff indicator (placeholder — map to Octopus / Agile etc.)
      - name: Energy tariff today
        unique_id: energy_tariff_today
        icon: mdi:flash
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            standard
          {% else %}
            unknown
          {% endif %}

      - name: Energy tariff tomorrow
        unique_id: energy_tariff_tomorrow
        icon: mdi:flash
        state: >
          {% if is_state('input_boolean.solar_dashboard_demo', 'on') %}
            off_peak
          {% else %}
            unknown
          {% endif %}
