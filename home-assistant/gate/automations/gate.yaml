# Gate automations — Tessie arrival + Tesla departure (relay 1 pulse hold).
# Live HA is the source of truth. Model X arrival/departure is the template.
#
# Model S Tessie GPS (drive_state) stays frozen at ~50 m home, so the Model X
# road/gate binary_sensors never turn on for S. person.gen / gens_phone (and
# person.dave when he drives S) still enter Road Approach then Gate Approach on
# time — that is the Model X tessie_road_on / tessie_gate_on equivalent.
# Occupant/odometer fallbacks open the gate after the car is already parked
# (too late). Do not use those as arrival.

- id: gate_begin_departure
  alias: Gate — begin departure (Tesla shift out of park)
  description: >-
    Sets was_away / departure flags when a Tesla starts leaving home.
    Model X: shift P→D/R (working). Model S shift stays Park, so driver door
    and person.gen/dave leaving home → Gate Approach are the same moment.
  triggers:
    - id: model_s_shift
      trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
    - id: model_x_shift
      trigger: state
      entity_id: sensor.x_shift_state
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
    - id: model_s_driver_door
      trigger: state
      entity_id: binary_sensor.model_s_p100d_front_driver_door
      from: "off"
      to: "on"
      for:
        seconds: 2
    - id: model_s_person_leave
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      from: home
      to:
        - Gate Approach
        - Road Approach
        - not_home
  conditions:
    - condition: template
      value_template: >-
        {% set eid = trigger.entity_id %}
        {% if eid == 'sensor.x_shift_state' %}
          {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.x_location', 'home') }}
        {% elif trigger.id == 'model_s_driver_door' %}
          {# Door opens when getting out after arriving as well as when leaving.
             5 Oct 02:42 UTC the gate pulsed on that exit. Only arm a departure
             when the S is not still flagged away from the trip just ending. #}
          {{ is_state('input_boolean.model_s_was_away', 'off')
             and is_state('input_boolean.gate_arrival_session', 'off')
             and is_state('binary_sensor.model_s_p100d_user_present', 'on')
             and (
               states('sensor.model_s_tessie_distance_to_home') | float(9999) < 120
               or is_state('device_tracker.model_s_p100d_location', 'home')
             ) }}
        {% elif eid in ['person.gen', 'person.dave', 'device_tracker.gens_phone'] %}
          {# Occupant in the S, not model_x_was_away. That flag blocked person
             departures whenever the X was away or the flag had stuck on. #}
          {{ is_state('input_boolean.model_s_was_away', 'off')
             and (
               is_state('binary_sensor.model_s_p100d_user_present', 'on')
               or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on')
             ) }}
        {% else %}
          {{ states('sensor.model_s_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.model_s_p100d_location', 'home') }}
        {% endif %}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'sensor.x_shift_state' }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.model_x_was_away
      default:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.model_s_was_away
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_departure_in_progress
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_arrival_session
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Departure started — Tessie arrival paused
    - if:
        - condition: template
          value_template: "{{ trigger.entity_id != 'sensor.x_shift_state' }}"
      then:
        - action: rest_command.tessie_wake_model_s
          continue_on_error: true
        - action: button.press
          target:
            entity_id: button.model_s_p100d_wake
          continue_on_error: true
  mode: single

- id: gate_end_departure
  alias: Gate — end departure hold when car is away
  triggers:
    - trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
        - sensor.x_shift_state
      to:
        - p
        - P
      for:
        seconds: 45
    - trigger: numeric_state
      entity_id:
        - sensor.model_s_p100d_speed
        - sensor.model_s_p100d_speed_2
        - sensor.x_speed
      above: 15
      for:
        seconds: 20
    - trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
        - device_tracker.x_location
      to: not_home
      for:
        seconds: 20
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_departure_in_progress', 'on')
           and (now() - states.input_boolean.gate_departure_in_progress.last_changed).total_seconds()
               > (states('input_number.gate_departure_hold_seconds') | float(75) + 15)
           and states('person.gen') not in ['home', 'Gate Approach']
           and states('person.dave') not in ['home', 'Gate Approach'] }}
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_departure_in_progress', 'on')
           and (now() - states.input_boolean.gate_departure_in_progress.last_changed).total_seconds() > 180 }}
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_departure_in_progress', 'on')
           and (
             (states('sensor.model_s_p100d_shift_state') | lower in ['d', 'r']
              and states('sensor.model_s_tessie_distance_to_home') | float(0) > 250)
             or (states('sensor.x_shift_state') | lower in ['d', 'r']
              and states('sensor.model_x_tessie_distance_to_home') | float(0) > 250)
           ) }}
      for:
        seconds: 30
  conditions:
    - condition: state
      entity_id: input_boolean.gate_departure_in_progress
      state: "on"
  actions:
    - action: script.turn_off
      target:
        entity_id:
          - script.gate_pulse_departure
          - script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_departure_in_progress
          - input_boolean.gate_exit_in_progress
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Departure complete — holds cleared
  mode: single

- id: gate_clear_exit_on_approach
  alias: Gate — clear blocks when Tessie reaches road approach
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.model_s_tessie_in_road_approach
        - binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
    - trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      from: not_home
      to:
        - Road Approach
        - Gate Approach
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_exit_in_progress
          - input_boolean.gate_departure_in_progress
      continue_on_error: true
  mode: single

- id: gate_clear_stale_exit_block
  alias: Gate — clear stale exit block after timeout
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_exit_in_progress', 'on')
           and (now() - states.input_boolean.gate_exit_in_progress.last_changed).total_seconds() > 600 }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gate_exit_in_progress
  mode: single

- id: gate_model_s_mark_away
  alias: Gate — Model S mark was away (Tessie)
  description: >-
    Same as Model X GPS > 300 m. Also mark when Gen/Dave leave home (Model S
    GPS never reports away) or odometer jumps > 1 km.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_home') | float(0) > 300 }}
      for:
        seconds: 90
    - id: person_left
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      to: not_home
      for:
        seconds: 30
    - id: odometer_jump
      trigger: template
      value_template: >-
        {% set home_odo = states('input_number.model_s_home_odometer') | float(0) %}
        {{ home_odo > 0
           and states('sensor.model_s_p100d_odometer') | float(0) - home_odo > 1.0 }}
  conditions:
    - condition: template
      value_template: >-
        {% if trigger.id == 'odometer_jump' %}
          true
        {% elif trigger.id == 'person_left' %}
          {{ is_state('input_boolean.model_s_was_away', 'on')
             or is_state('binary_sensor.model_s_p100d_user_present', 'on')
             or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on') }}
        {% else %}
          true
        {% endif %}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.model_s_was_away
  mode: restart

- id: gate_model_s_clear_away
  alias: Gate — Model S clear was away at home
  description: >-
    Same idea as Model X (home + Park). Never clear while Gen or Dave is still
    not_home / on approach — stale Tessie GPS says ~50 m even when the car is out.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('person.gen') not in ['not_home', 'Road Approach', 'Gate Approach']
           and states('person.dave') not in ['not_home', 'Road Approach', 'Gate Approach']
           and states('sensor.model_s_p100d_shift_state') | lower == 'p'
           and is_state('binary_sensor.model_s_p100d_user_present', 'off')
           and is_state('binary_sensor.model_s_p100d_front_driver_door', 'off')
           and (
             is_state('input_boolean.model_s_was_away', 'on')
             or (states('sensor.model_s_p100d_odometer') | float(0)
                 - states('input_number.model_s_home_odometer') | float(0) > 0.2)
           ) }}
      for:
        minutes: 3
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.model_s_was_away
    - action: input_number.set_value
      target:
        entity_id: input_number.model_s_home_odometer
      data:
        value: "{{ states('sensor.model_s_p100d_odometer') | float(0) }}"
      continue_on_error: true
  mode: single

- id: gate_model_x_clear_away
  alias: Gate — Model X clear was away at home
  description: >-
    model_x_was_away used to stay on if the Model X arrival run stopped before
    its turn_off (notify.halo is not a service, so that action aborted the
    rest). Clear it once the X is parked at home. S departure no longer reads
    this flag; this still keeps the X arrival gate honest.
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.model_x_was_away', 'on')
           and states('sensor.model_x_tessie_distance_to_home') | float(9999) < 80
           and states('sensor.x_shift_state') | lower in ['p', 'unknown', 'unavailable', 'none'] }}
      for:
        minutes: 3
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.model_x_was_away
  mode: single

- id: gate_tessie_wake_while_away
  alias: Gate — wake Tessie while Model S is away
  description: >-
    Model X wakes every 5 min while was_away and GPS > 200 m. Model S GPS stays
    home, so wake whenever was_away and Gen/Dave are still out (or occupant on).
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.model_s_was_away
      state: "on"
    - condition: template
      value_template: >-
        {{ states('person.gen') in ['not_home', 'Road Approach', 'Gate Approach']
           or states('person.dave') in ['not_home', 'Road Approach', 'Gate Approach']
           or states('sensor.model_s_tessie_distance_to_home') | float(0) > 150
           or is_state('binary_sensor.model_s_p100d_user_present', 'on')
           or is_state('device_tracker.model_s_p100d_location', 'not_home')
           or is_state('device_tracker.model_s_p100d_location', 'Road Approach')
           or is_state('device_tracker.model_s_p100d_location', 'Gate Approach') }}
  actions:
    - action: rest_command.tessie_wake_model_s
      continue_on_error: true
    - action: button.press
      target:
        entity_id: button.model_s_p100d_wake
      continue_on_error: true
  mode: single

- id: gate_end_arrival_session
  alias: Gate — end Tessie arrival session at home
  description: Stops repulsing when the car is parked at home or session times out.
  triggers:
    - trigger: state
      entity_id:
        - person.gen
        - person.dave
      to: home
      for:
        minutes: 2
    - trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 70
           and states('sensor.x_shift_state') | lower == 'p' }}
      for:
        minutes: 2
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_arrival_session', 'on')
           and (now() - states.input_boolean.gate_arrival_session.last_changed).total_seconds()
               > (states('input_number.gate_hold_max_minutes') | float(8) * 60) }}
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "on"
  actions:
    - action: script.turn_off
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_arrival_session
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Tessie arrival complete — car at home
  mode: single

- id: gate_open_on_arrival
  alias: Gate — open on Tessie arrival (Model S)
  description: >-
    Opens the gate after model_s_was_away when a phone enters Road Approach or
    Gate Approach, or when a phone jumps straight to home (5 Oct 02:36 UTC Gen
    returned not_home → home and the gate never ran). Model X in an approach
    zone does not count — that arrival has its own automation. The relay is
    pulsed before any Tessie wake. was_away stays on until the car is parked
    so the driver-door departure trigger does not fire while someone gets out.
  triggers:
    - id: tessie_road_on
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: tessie_gate_on
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: tessie_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and is_state('input_boolean.model_s_was_away', 'on')
           and states('sensor.model_s_tessie_distance_to_home') | float(0) > 80 }}
      for:
        seconds: 10
    - id: person_road
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Gate Approach
        - unknown
        - unavailable
      to: Road Approach
    - id: person_gate
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - unknown
        - unavailable
      to: Gate Approach
    - id: person_home
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      not_from:
        - home
        - Road Approach
        - Gate Approach
        - unknown
        - unavailable
      to: home
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "off"
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: state
      entity_id: input_boolean.model_s_was_away
      state: "on"
    - condition: template
      value_template: >-
        {% if trigger.id in ['person_road', 'person_gate', 'person_home'] %}
          {{ not is_state('binary_sensor.model_x_tessie_in_road_approach', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_gate_approach', 'on')
             and (
               trigger.id != 'person_home'
               or is_state('binary_sensor.model_s_p100d_user_present', 'on')
               or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on')
             ) }}
        {% else %}
          {{ not (
               states('sensor.model_s_tessie_distance_to_home') | float(9999) < 80
               and states('sensor.model_s_p100d_shift_state') | lower == 'p'
             ) }}
        {% endif %}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.model_s_p100d_shift_state') | lower == 'r'
             and states('sensor.model_s_tessie_distance_to_gate') | float(999) < 80
             and states('sensor.model_s_p100d_speed') | float(0) > 1
           ) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_arrival_session
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: "Opening gate — Model S {{ trigger.id }}"
    - action: shell_command.akuvox_gate_open_relay_1
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: Gate opening
        message: "Model S approach ({{ trigger.id }}). Opening now."
        data:
          tag: gate_approach
          channel: gate
          importance: high
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gate_exit_in_progress
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_approach
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Gate relay 1 pulsing — Tessie session active
    - action: rest_command.tessie_wake_model_s
      continue_on_error: true
  mode: single

- id: gate_open_on_arrival_model_x
  alias: Gate — open on Tessie arrival (Model X)
  description: >-
    Opens when Model X approaches after a real trip (model_x_was_away). Ignores
    road/gate zone flicker while parked or without a prior away trip.
  triggers:
    - id: tessie_road_on
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: tessie_gate_on
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: tessie_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and is_state('input_boolean.model_x_was_away', 'on') }}
      for:
        seconds: 10
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "off"
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: state
      entity_id: input_boolean.model_x_was_away
      state: "on"
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.model_x_tessie_distance_to_home') | float(9999) < 80
             and states('sensor.x_shift_state') | lower == 'p'
           ) }}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.x_shift_state') | lower == 'r'
             and states('sensor.model_x_tessie_distance_to_gate') | float(999) < 80
             and states('sensor.x_speed') | float(0) > 1
           ) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_arrival_session
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: "Opening gate — Model X {{ trigger.id }}"
    - action: shell_command.akuvox_gate_open_relay_1
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: Gate opening
        message: "Model X Tessie approach ({{ trigger.id }}). Opening now."
        data:
          tag: gate_approach
          channel: gate
          importance: high
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_exit_in_progress
          - input_boolean.model_x_was_away
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_approach
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Gate relay 1 pulsing — Tessie session active
    - action: rest_command.tessie_wake_model_x
      continue_on_error: true
  mode: single

- id: gate_open_tesla_departure
  alias: Gate — open when Tesla leaves park at home
  description: >-
    Clone of Model X departure (shift P→D/R at home) plus Model S driver door
    and person.gen/dave leaving home, because Model S shift_state stays Park.
    Opens gate + House Garage.
  triggers:
    - id: model_s_shift
      trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
    - id: model_x_shift
      trigger: state
      entity_id: sensor.x_shift_state
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
    - id: model_s_driver_door
      trigger: state
      entity_id: binary_sensor.model_s_p100d_front_driver_door
      from: "off"
      to: "on"
      for:
        seconds: 2
    - id: model_s_person_leave
      trigger: state
      entity_id:
        - person.gen
        - person.dave
        - device_tracker.gens_phone
      from: home
      to:
        - Gate Approach
        - Road Approach
        - not_home
  conditions:
    - condition: template
      value_template: >-
        {% set eid = trigger.entity_id %}
        {% if eid == 'sensor.x_shift_state' %}
          {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.x_location', 'home') }}
        {% elif trigger.id == 'model_s_driver_door' %}
          {{ is_state('input_boolean.model_s_was_away', 'off')
             and is_state('input_boolean.gate_arrival_session', 'off')
             and is_state('binary_sensor.model_s_p100d_user_present', 'on')
             and (
               states('sensor.model_s_tessie_distance_to_home') | float(9999) < 120
               or is_state('device_tracker.model_s_p100d_location', 'home')
             ) }}
        {% elif eid in ['person.gen', 'person.dave', 'device_tracker.gens_phone'] %}
          {{ is_state('binary_sensor.model_s_p100d_user_present', 'on')
             or is_state('binary_sensor.model_s_p100d_front_driver_door', 'on') }}
        {% else %}
          {{ states('sensor.model_s_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.model_s_p100d_location', 'home') }}
        {% endif %}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_departure
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_tesla
    - action: "{{ 'rest_command.tessie_wake_model_x' if trigger.id == 'model_x_shift' else 'rest_command.tessie_wake_model_s' }}"
      continue_on_error: true
  mode: single
