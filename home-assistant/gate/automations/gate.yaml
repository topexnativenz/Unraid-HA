# Gate automations — Tessie arrival + Tesla departure (relay 1 pulse hold).
# Live HA is the source of truth. Model X arrival/departure is the template.
#
# Model S does not use phone location. Departure is shift into Reverse, with
# Drive as the backup, while the car is still at home. Arrival is Tessie
# vehicle location only (distance falling through 1.6 km, or the car's own
# approach zones). Sitting in the car and shutting the door does not open
# the gate. Model X shift and approach triggers in this file are unchanged.

- id: gate_begin_departure
  alias: Gate — begin departure (Tesla shift out of park)
  description: >-
    Sets was_away / departure flags when a Tesla starts leaving home.
    Model X: shift P→D/R. Model S: shift into Reverse, or Drive if Reverse
    is missed, while Tessie still places the car at home (or it has not yet
    been marked away). Phones and the driver door are not used.
  triggers:
    - id: model_s_shift
      trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
      from:
        - p
        - P
        - unknown
        - unavailable
      to:
        - d
        - r
        - D
        - R
    - id: model_x_shift
      trigger: state
      entity_id: sensor.x_shift_state
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
  conditions:
    - condition: template
      value_template: >-
        {% set eid = trigger.entity_id %}
        {% if eid == 'sensor.x_shift_state' %}
          {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.x_location', 'home') }}
        {% else %}
          {% set away = states.input_boolean.model_s_was_away %}
          {% set spd = [
               states('sensor.model_s_p100d_speed') | float(0),
               states('sensor.model_s_p100d_speed_2') | float(0)
             ] | max %}
          {% set dist = states('sensor.model_s_tessie_distance_to_home') %}
          {% set at_home = dist in ['unknown', 'unavailable', 'none', '']
             or dist | float(9999) < 250 %}
          {{ spd < 15
             and at_home
             and (
               is_state('input_boolean.model_s_was_away', 'off')
               or (
                 away.last_changed is not none
                 and (now() - away.last_changed).total_seconds() < 8
               )
             ) }}
        {% endif %}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'sensor.x_shift_state' }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.model_x_was_away
      default:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.model_s_was_away
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_departure_in_progress
      continue_on_error: true
    - action: script.turn_off
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_arrival_session
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Departure started — Tessie arrival paused
    - if:
        - condition: template
          value_template: "{{ trigger.entity_id != 'sensor.x_shift_state' }}"
      then:
        - action: rest_command.tessie_wake_model_s
          continue_on_error: true
        - action: button.press
          target:
            entity_id: button.model_s_p100d_wake
          continue_on_error: true
  mode: single

- id: gate_end_departure
  alias: Gate — end departure hold when car is away
  triggers:
    - trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
        - sensor.x_shift_state
      to:
        - p
        - P
      for:
        seconds: 45
    - trigger: numeric_state
      entity_id:
        - sensor.model_s_p100d_speed
        - sensor.model_s_p100d_speed_2
        - sensor.x_speed
      above: 15
      for:
        seconds: 20
    - trigger: state
      entity_id: device_tracker.x_location
      to: not_home
      for:
        seconds: 20
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_departure_in_progress', 'on')
           and (now() - states.input_boolean.gate_departure_in_progress.last_changed).total_seconds() > 180 }}
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_departure_in_progress', 'on')
           and (
             (states('sensor.model_s_p100d_shift_state') | lower in ['d', 'r']
              and states('sensor.model_s_tessie_distance_to_home') | float(0) > 250)
             or (states('sensor.x_shift_state') | lower in ['d', 'r']
              and states('sensor.model_x_tessie_distance_to_home') | float(0) > 250)
           ) }}
      for:
        seconds: 30
  conditions:
    - condition: state
      entity_id: input_boolean.gate_departure_in_progress
      state: "on"
  actions:
    - action: script.turn_off
      target:
        entity_id:
          - script.gate_pulse_departure
          - script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_departure_in_progress
          - input_boolean.gate_exit_in_progress
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Departure complete — holds cleared
  mode: single

- id: gate_clear_exit_on_approach
  alias: Gate — clear blocks when Tessie reaches road approach
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.model_s_tessie_in_road_approach
        - binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_exit_in_progress
          - input_boolean.gate_departure_in_progress
      continue_on_error: true
  mode: single

- id: gate_clear_stale_exit_block
  alias: Gate — clear stale exit block after timeout
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_exit_in_progress', 'on')
           and (now() - states.input_boolean.gate_exit_in_progress.last_changed).total_seconds() > 600 }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gate_exit_in_progress
  mode: single

- id: gate_model_s_mark_away
  alias: Gate — Model S mark was away (Tessie)
  description: >-
    Marks the S away when Tessie distance stays over 300 m, or the odometer
    jumps more than 1 km. Phones are not used.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_home') | float(0) > 300 }}
      for:
        seconds: 90
    - id: odometer_jump
      trigger: template
      value_template: >-
        {% set home_odo = states('input_number.model_s_home_odometer') | float(0) %}
        {{ home_odo > 0
           and states('sensor.model_s_p100d_odometer') | float(0) - home_odo > 1.0 }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.model_s_was_away
  mode: restart

- id: gate_model_s_clear_away
  alias: Gate — Model S clear was away at home
  description: >-
    Clears the away flag once Tessie distance is under 120 m, shift is Park,
    and nobody is in the car. Does not look at phones.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_home') | float(9999) < 120
           and states('sensor.model_s_p100d_shift_state') | lower == 'p'
           and is_state('binary_sensor.model_s_p100d_user_present', 'off')
           and is_state('binary_sensor.model_s_p100d_front_driver_door', 'off')
           and (
             is_state('input_boolean.model_s_was_away', 'on')
             or (states('sensor.model_s_p100d_odometer') | float(0)
                 - states('input_number.model_s_home_odometer') | float(0) > 0.2)
           ) }}
      for:
        minutes: 3
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.model_s_was_away
    - action: input_number.set_value
      target:
        entity_id: input_number.model_s_home_odometer
      data:
        value: "{{ states('sensor.model_s_p100d_odometer') | float(0) }}"
      continue_on_error: true
  mode: single

- id: gate_model_x_clear_away
  alias: Gate — Model X clear was away at home
  description: >-
    model_x_was_away used to stay on if the Model X arrival run stopped before
    its turn_off (notify.halo is not a service, so that action aborted the
    rest). Clear it once the X is parked at home. S departure no longer reads
    this flag; this still keeps the X arrival gate honest.
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.model_x_was_away', 'on')
           and states('sensor.model_x_tessie_distance_to_home') | float(9999) < 80
           and states('sensor.x_shift_state') | lower in ['p', 'unknown', 'unavailable', 'none'] }}
      for:
        minutes: 3
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.model_x_was_away
  mode: single

- id: gate_tessie_wake_while_away
  alias: Gate — wake Tessie while Model S is away
  description: >-
    While the S is flagged away, ask Tessie to wake it every 5 minutes so a
    fresh shift and location can be read. The Model S wake call currently
    returns unsupported until the virtual key is paired.
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.model_s_was_away
      state: "on"
  actions:
    - action: rest_command.tessie_wake_model_s
      continue_on_error: true
    - action: button.press
      target:
        entity_id: button.model_s_p100d_wake
      continue_on_error: true
  mode: single

- id: gate_end_arrival_session
  alias: Gate — end Tessie arrival session at home
  description: Stops repulsing when the car is parked at home or session times out.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_home') | float(9999) < 80
           and states('sensor.model_s_p100d_shift_state') | lower == 'p'
           and is_state('binary_sensor.model_s_p100d_user_present', 'off') }}
      for:
        minutes: 2
    - trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 70
           and states('sensor.x_shift_state') | lower == 'p' }}
      for:
        minutes: 2
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.gate_arrival_session', 'on')
           and (now() - states.input_boolean.gate_arrival_session.last_changed).total_seconds()
               > (states('input_number.gate_hold_max_minutes') | float(8) * 60) }}
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "on"
  actions:
    - action: script.turn_off
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_arrival_session
          - input_boolean.gate_hold_active
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Tessie arrival complete — car at home
  mode: single

- id: gate_open_on_arrival
  alias: Gate — open on Tessie arrival (Model S)
  description: >-
    Opens the gate after model_s_was_away from the Model S Tessie location
    only: distance_to_home falls through the 350–1600 m band while heading
    home, or the car enters its road or gate approach zone. Phones are not
    used. Until Tessie location actually moves, this cannot see the car
    coming home. Model X in an approach zone does not count. The relay is
    the first action. was_away stays on until the car is parked.
  triggers:
    - id: tessie_road_on
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: tessie_gate_on
      trigger: state
      entity_id: binary_sensor.model_s_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: tessie_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_s_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and is_state('input_boolean.model_s_was_away', 'on')
           and states('sensor.model_s_tessie_distance_to_home') | float(0) > 80 }}
      for:
        seconds: 10
    - id: tessie_closing_in
      trigger: numeric_state
      entity_id: sensor.model_s_tessie_distance_to_home
      above: 350
      below: 1600
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "off"
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: state
      entity_id: input_boolean.model_s_was_away
      state: "on"
    - condition: template
      value_template: >-
        {% if trigger.id == 'tessie_closing_in' %}
          {{ trigger.from_state is not none
             and trigger.from_state.state | float(0) > trigger.to_state.state | float(9999)
             and is_state('binary_sensor.model_s_p100d_user_present', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_road_approach', 'on')
             and not is_state('binary_sensor.model_x_tessie_in_gate_approach', 'on') }}
        {% else %}
          {{ not (
               states('sensor.model_s_tessie_distance_to_home') | float(9999) < 80
               and states('sensor.model_s_p100d_shift_state') | lower == 'p'
             ) }}
        {% endif %}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.model_s_p100d_shift_state') | lower == 'r'
             and states('sensor.model_s_tessie_distance_to_gate') | float(999) < 80
             and states('sensor.model_s_p100d_speed') | float(0) > 1
           ) }}
  actions:
    - action: shell_command.akuvox_gate_open_relay_1
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_arrival_session
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: "Opening gate — Model S {{ trigger.id }}"
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: Gate opening
        message: "Model S approach ({{ trigger.id }}). Opening now."
        data:
          tag: gate_approach
          channel: gate
          importance: high
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gate_exit_in_progress
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_approach
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Gate relay 1 pulsing — Tessie session active
    - action: rest_command.tessie_wake_model_s
      continue_on_error: true
  mode: single

- id: gate_open_on_arrival_model_x
  alias: Gate — open on Tessie arrival (Model X)
  description: >-
    Opens when Model X approaches after a real trip (model_x_was_away). Ignores
    road/gate zone flicker while parked or without a prior away trip.
  triggers:
    - id: tessie_road_on
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_road_approach
      from: "off"
      to: "on"
    - id: tessie_gate_on
      trigger: state
      entity_id: binary_sensor.model_x_tessie_in_gate_approach
      from: "off"
      to: "on"
    - id: tessie_gate_distance
      trigger: template
      value_template: >-
        {{ states('sensor.model_x_tessie_distance_to_gate') | float(9999)
           < states('input_number.gate_tessie_trigger_distance_m') | float(180)
           and is_state('input_boolean.model_x_was_away', 'on') }}
      for:
        seconds: 10
  conditions:
    - condition: state
      entity_id: input_boolean.gate_arrival_session
      state: "off"
    - condition: template
      value_template: >-
        {{ not is_state('input_boolean.gate_departure_in_progress', 'on') }}
    - condition: state
      entity_id: input_boolean.model_x_was_away
      state: "on"
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.model_x_tessie_distance_to_home') | float(9999) < 80
             and states('sensor.x_shift_state') | lower == 'p'
           ) }}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
    - condition: template
      value_template: >-
        {{ not (
             states('sensor.x_shift_state') | lower == 'r'
             and states('sensor.model_x_tessie_distance_to_gate') | float(999) < 80
             and states('sensor.x_speed') | float(0) > 1
           ) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.gate_arrival_session
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: "Opening gate — Model X {{ trigger.id }}"
    - action: shell_command.akuvox_gate_open_relay_1
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_hold_approach
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: notify.mobile_app_halo
      continue_on_error: true
      data:
        title: Gate opening
        message: "Model X Tessie approach ({{ trigger.id }}). Opening now."
        data:
          tag: gate_approach
          channel: gate
          importance: high
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.gate_exit_in_progress
          - input_boolean.model_x_was_away
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_approach
    - action: input_text.set_value
      target:
        entity_id: input_text.gate_status_message
      data:
        value: Gate relay 1 pulsing — Tessie session active
    - action: rest_command.tessie_wake_model_x
      continue_on_error: true
  mode: single

- id: gate_open_tesla_departure
  alias: Gate — open when Tesla leaves park at home
  description: >-
    Opens the gate when a Tesla leaves home. Model X: shift P→D/R. Model S:
    shift into Reverse, with Drive as the backup, while the car is still at
    home. Getting in and shutting the door does not open the gate, and phones
    are not used. The relay script is the first action.
  triggers:
    - id: model_s_shift
      trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.model_s_p100d_shift_state_2
      from:
        - p
        - P
        - unknown
        - unavailable
      to:
        - d
        - r
        - D
        - R
    - id: model_x_shift
      trigger: state
      entity_id: sensor.x_shift_state
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
      for:
        seconds: 5
  conditions:
    - condition: template
      value_template: >-
        {% set eid = trigger.entity_id %}
        {% if eid == 'sensor.x_shift_state' %}
          {{ states('sensor.model_x_tessie_distance_to_home') | float(9999) < 120
             or is_state('device_tracker.x_location', 'home') }}
        {% else %}
          {% set away = states.input_boolean.model_s_was_away %}
          {% set spd = [
               states('sensor.model_s_p100d_speed') | float(0),
               states('sensor.model_s_p100d_speed_2') | float(0)
             ] | max %}
          {% set dist = states('sensor.model_s_tessie_distance_to_home') %}
          {% set at_home = dist in ['unknown', 'unavailable', 'none', '']
             or dist | float(9999) < 250 %}
          {{ spd < 15
             and at_home
             and (
               is_state('input_boolean.model_s_was_away', 'off')
               or (
                 away.last_changed is not none
                 and (now() - away.last_changed).total_seconds() < 8
               )
             ) }}
        {% endif %}
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 180 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.gate_pulse_departure
    - action: script.turn_on
      target:
        entity_id: script.house_garage_open_if_closed
      continue_on_error: true
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_open
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.gate_last_relay
      data:
        option: auto_tesla
    - action: "{{ 'rest_command.tessie_wake_model_x' if trigger.id == 'model_x_shift' else 'rest_command.tessie_wake_model_s' }}"
      continue_on_error: true
  mode: single

- id: model_s_refresh_approach_while_driving
  alias: Model S — refresh Tessie shift and location while driving
  description: >-
    While someone is in the Model S, or it is flagged away, force a fresh
    read of the Tessie shift, speed, and location sensors every 5 seconds.
    Does not ask any phone for a location.
  triggers:
    - trigger: time_pattern
      seconds: "/5"
  conditions:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.model_s_p100d_user_present', 'on')
           or is_state('input_boolean.model_s_was_away', 'on') }}
  actions:
    - action: homeassistant.update_entity
      continue_on_error: true
      target:
        entity_id: sensor.model_s_p100d_shift_state
  mode: single
