- id: gate_open_tesla_departure
  alias: Gate — open when Tesla leaves park at home
  triggers:
    - trigger: state
      entity_id:
        - sensor.model_s_p100d_shift_state
        - sensor.x_shift_state
      from:
        - p
        - P
      to:
        - d
        - r
        - D
        - R
  conditions:
    - condition: template
      value_template: >-
        {% set last = states.input_datetime.gate_last_open %}
        {{ last.last_changed is none
           or (now() - last.last_changed).total_seconds() > 120 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.gate_open_tesla_when_leaving
  mode: single
