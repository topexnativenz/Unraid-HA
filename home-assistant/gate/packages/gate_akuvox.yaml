# Relay 1 = momentary pulse (shell_command in configuration.yaml). Relay 2 = latch — not used by automations.
template:
  - button:
      - name: "Gate Open"
        unique_id: gate_open_button
        press:
          - service: shell_command.akuvox_gate_open_relay_1
      - name: "Gate Open Relay 2"
        unique_id: gate_open_relay_2_button
        press:
          - service: shell_command.akuvox_gate_open_relay_2
  - binary_sensor:
      - name: Gate arrival passage active
        unique_id: gate_arrival_passage_active
        icon: mdi:gate-arrow-right
        state: >-
          {% set session = is_state('input_boolean.gate_arrival_session', 'on') %}
          {% if not session %}
            false
          {% else %}
            {% set session_age = (now() - states.input_boolean.gate_arrival_session.last_changed).total_seconds() %}
            {% set max_sec = states('input_number.gate_hold_max_minutes') | float(8) * 60 %}
            {% set dist_home = states('sensor.model_s_tessie_distance_to_home') | float(9999) %}
            {% set in_approach = is_state('binary_sensor.model_s_tessie_in_road_approach', 'on')
               or is_state('binary_sensor.model_s_tessie_in_gate_approach', 'on') %}
            {% set car_at_home = dist_home < 60
               and states('sensor.model_s_p100d_shift_state') | lower in ['p', ''] %}
            {% set dead_zone = states('input_number.gate_early_hold_seconds') | float(180) %}
            {% set grace = states('input_number.gate_approach_grace_seconds') | float(90) %}
            {{
              session_age < max_sec
              and (
                in_approach
                or (not car_at_home and session_age < dead_zone)
                or (car_at_home and not in_approach and session_age < grace)
              )
            }}
          {% endif %}
      - name: Gate departure hold active
        unique_id: gate_departure_hold_active
        icon: mdi:car-arrow-left
        state: >-
          {% set dep = is_state('input_boolean.gate_departure_in_progress', 'on') %}
          {% if not dep %}
            false
          {% else %}
            {% set age = (now() - states.input_boolean.gate_departure_in_progress.last_changed).total_seconds() %}
            {% set max_s = states('input_number.gate_departure_hold_seconds') | float(75) %}
            {{
              age < max_s
              and states('sensor.model_s_p100d_shift_state') | lower in ['d', 'r']
              and states('sensor.model_s_p100d_speed') | float(0) < 15
            }}
          {% endif %}

input_datetime:
  gate_last_open:
    name: Gate Last Open
    has_date: true
    has_time: true

input_select:
  gate_last_relay:
    name: Gate Last Relay
    options:
      - unknown
      - relay_1
      - relay_2
      - auto_approach
      - auto_tesla

input_number:
  gate_hold_repulse_seconds:
    name: Gate hold repulse interval
    min: 3
    max: 30
    step: 1
    initial: 4
    unit_of_measurement: s
    icon: mdi:timer-sync
  gate_hold_max_minutes:
    name: Gate hold maximum duration
    min: 2
    max: 15
    step: 1
    initial: 8
    unit_of_measurement: min
    icon: mdi:timer-lock
  gate_approach_grace_seconds:
    name: Gate approach grace after entering home
    min: 30
    max: 300
    step: 15
    initial: 120
    unit_of_measurement: s
    icon: mdi:timer-sand

script:
  gate_pulse_open_once:
    alias: Gate — pulse open once (relay 1)
    description: Single momentary pulse on relay 1 (manual / test).
    mode: single
    sequence:
      - action: shell_command.akuvox_gate_open_relay_1
      - action: input_select.select_option
        target:
          entity_id: input_select.gate_last_relay
        data:
          option: relay_1

  gate_pulse_hold_approach:
    alias: Gate — pulse hold for arrival (relay 1)
    description: >-
      Re-pulses relay 1 while Tessie reports road/gate approach or dead-zone tail.
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gate_hold_active
      - action: shell_command.akuvox_gate_open_relay_1
      - action: input_select.select_option
        target:
          entity_id: input_select.gate_last_relay
        data:
          option: relay_1
      - repeat:
          until:
            - condition: state
              entity_id: binary_sensor.gate_arrival_passage_active
              state: "off"
            - condition: template
              value_template: >-
                {{ repeat.index >= (
                     (states('input_number.gate_hold_max_minutes') | float(8) * 60)
                     / (states('input_number.gate_hold_repulse_seconds') | float(4))
                   ) | int(120) }}
          sequence:
            - delay:
                seconds: "{{ states('input_number.gate_hold_repulse_seconds') | int(4) }}"
            - condition: state
              entity_id: binary_sensor.gate_arrival_passage_active
              state: "on"
            - action: shell_command.akuvox_gate_open_relay_1
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gate_hold_active

  gate_pulse_departure:
    alias: Gate — short pulse hold for departure (relay 1)
    description: >-
      Brief repulse while the car is in Drive/Reverse leaving home (default ~75 s cap).
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gate_hold_active
      - action: shell_command.akuvox_gate_open_relay_1
      - action: input_select.select_option
        target:
          entity_id: input_select.gate_last_relay
        data:
          option: auto_tesla
      - repeat:
          until:
            - condition: state
              entity_id: binary_sensor.gate_departure_hold_active
              state: "off"
            - condition: template
              value_template: >-
                {{ repeat.index >= (
                     (states('input_number.gate_departure_hold_seconds') | float(75))
                     / (states('input_number.gate_hold_repulse_seconds') | float(4))
                   ) | int(20) }}
          sequence:
            - delay:
                seconds: "{{ states('input_number.gate_hold_repulse_seconds') | int(4) }}"
            - condition: state
              entity_id: binary_sensor.gate_departure_hold_active
              state: "on"
            - action: shell_command.akuvox_gate_open_relay_1
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gate_hold_active

  gate_open_tesla_when_leaving:
    alias: Gate — open when Tesla starts leaving home
    description: Single pulse + short departure hold (not long arrival session).
    mode: single
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.gate_pulse_hold_approach
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.gate_arrival_session
            - input_boolean.gate_hold_active
      - action: shell_command.akuvox_gate_open_relay_1
      - action: script.turn_on
        target:
          entity_id: script.gate_pulse_departure
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.gate_last_open
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.gate_last_relay
        data:
          option: auto_tesla
