# Gate helpers (see automations/gate.yaml)

input_boolean:
  gate_exit_in_progress:
    name: Gate exit in progress
    icon: mdi:gate-open
  gate_hold_active:
    name: Gate hold active
    icon: mdi:gate-arrow-right
  model_s_was_away:
    name: Model S was away (Tessie arrival)
    icon: mdi:car-arrow-right
  dave_was_outside:
    name: Dave phone was outside (gate arrival)
    icon: mdi:cellphone-arrow-right
  gen_was_outside:
    name: Gen phone was outside (gate arrival)
    icon: mdi:cellphone-arrow-right
  gate_arrival_session:
    name: Gate arrival session (one open until through)
    icon: mdi:gate-arrow-right
  gate_departure_in_progress:
    name: Gate departure in progress
    icon: mdi:gate-arrow-left

input_text:
  gate_status_message:
    name: Gate status message
    max: 255
    initial: Idle
    icon: mdi:gate
